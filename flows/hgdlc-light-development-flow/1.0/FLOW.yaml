id: hgdlc-light-development-flow
version: "1.0"
canonical_name: hgdlc-light-development-flow@1.0
title: HGDLC Light Development Flow
description: >
  Лёгкий цикл разработки с участием человека на каждом ключевом этапе.
  Последовательность: уточняющие вопросы → ответы пользователя →
  план имплементации → апрув плана → разработка → ревью кода →
  апрув итогового кода.
coding_agent: qwen
start_node_id: ai-clarifying-questions
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:

  # ── Шаг 1: Генерация уточняющих вопросов ─────────────────────────────────
  - id: ai-clarifying-questions
    title: Генерация уточняющих вопросов
    type: ai
    routing_type: static
    checkpoint_before_run: false
    execution_context: []
    instruction: |
      <#if (run.feature_request)?? && run.feature_request?has_content>
      Запрос пользователя:
      ${run.feature_request}
      </#if>

      Изучи кодовую базу проекта и запрос пользователя.
      Сформулируй 10–15 уточняющих вопросов,
      которые напрямую влияют на выбор решения. Строго следуй скилу.
    skill_refs:
      - hgdlc-ask-clarifying-questions@1.0
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-answer-questions
    allow_retry: true
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 2: Ответы пользователя на вопросы ────────────────────────────────
  - id: human-answer-questions
    title: Ответы на уточняющие вопросы
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-clarifying-questions
        path: questions.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Открой questions.md.
      Отметь чекбокс у выбранного варианта в каждом вопросе.
      Если ни один вариант не выбран — будет использован рекомендуемый.
      Нажми Submit когда ответишь на все вопросы.
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-implementation-plan
    on_rework:
      transition: ai-clarifying-questions

  # ── Шаг 3: Построение плана имплементации ────────────────────────────────
  - id: ai-implementation-plan
    title: Построение плана имплементации
    type: ai
    routing_type: static
    checkpoint_before_run: false
    execution_context:
      - type: artifact_ref
        node_id: human-answer-questions
        path: questions.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Изучи запрос пользователя и ответы на уточняющие вопросы из questions.md.
      Исследуй кодовую базу проекта: структуру пакетов, существующие паттерны,
      миграции, тесты.
      Сохрани результат в implementation-plan.md.
    skill_refs:
      - hgdlc-implementation-plan@1.0
    produced_artifacts:
      - scope: run
        path: implementation-plan.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-implementation-plan
    allow_retry: true
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 4: Апрув плана имплементации ─────────────────────────────────────
  - id: approve-implementation-plan
    title: Проверка и апрув плана имплементации
    type: human_approval
    execution_context: []
    instruction: |
      Проверь план имплементации в файле implementation-plan.md.

      Убедись, что:
      - Все затронутые файлы перечислены с пометкой Create или Modify
      - Порядок слоёв корректен (миграции → сущности → репозитории → сервисы →
        контроллеры → тесты → конфигурация)
      - Каждый шаг содержит конкретное описание изменения
      - Команды верификации реалистичны для данного проекта

      Апруй для начала разработки или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-develop
    on_rework:
      transition: ai-implementation-plan

  # ── Шаг 5: Разработка ─────────────────────────────────────────────────────
  - id: ai-develop
    title: Реализация по плану
    type: ai
    routing_type: static
    checkpoint_before_run: true
    execution_context:
      - type: artifact_ref
        node_id: ai-implementation-plan
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-code-review
        path: code-review-report.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#if (step["ai-code-review"])?? && (step["ai-code-review"]["rework_instruction"])??>${step["ai-code-review"]["rework_instruction"]}
      <#else>
      Выполни план имплементации из implementation-plan.md шаг за шагом:
        - Находи первый невыполненный шаг [ ] и реализуй его.
        - После выполнения помечай шаг [x] и обновляй implementation-plan.md.
        - После каждого слоя запускай команду верификации из плана.
        - Не создавай копии файлов с суффиксами _modified, _new и т.п. —
          изменяй файлы непосредственно.
      </#if>
    skill_refs: []
    produced_artifacts: []
    expected_mutations: []
    on_success:
      transition: ai-code-review
    allow_retry: true

  # ── Шаг 6: Ревью кода ─────────────────────────────────────────────────────
  - id: ai-code-review
    title: Ревью кода
    type: ai
    routing_type: dynamic
    checkpoint_before_run: false
    execution_context:
      - type: artifact_ref
        node_id: ai-implementation-plan
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: human-answer-questions
        path: questions.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Проведи ревью всех изменений, внесённых на шаге разработки.
      Следуй приложенному скилу hgdlc-code-review: оцени изменения по пяти осям
      (корректность, читаемость, архитектура, безопасность, производительность).
      Сохрани отчёт в code-review-report.md.

      После завершения ревью заполни step-summary.
      Добавь в step-summary для этой ноды:
      - route: "on_rework" если есть замечания severity "critical" или "major"; "on_success" если только "minor" / "info" или замечаний нет
      - actions: непустой массив выполненных действий ревью
      - issues: массив замечаний (пустой если нет; для on_rework — минимум одно замечание)
      - rework_instruction: строка, обязательна если route="on_rework"; конкретный нумерованный список исправлений по файлам/строкам (читается FTL-шаблоном на шаге разработки)

      Примеры заполнения:
      - actions: ["провёл ревью кода по пяти осям", "выполнил оценку на наличие критических и требуемых замечаний"]
      - route: "on_rework"
      - issues: [
        {"severity": "critical", "file": "path/to/File.java", "line": 42, "message": "описание проблемы"},
        {"severity": "major", "file": "path/to/File.java", "message": "описание проблемы"}
        ]
      - rework_instruction: "Конкретный список исправлений:\n1. {файл:строка — что именно исправить}\n2. ..."

    skill_refs:
      - hgdlc-code-review@1.0
    produced_artifacts:
      - scope: run
        path: code-review-report.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-final-code
    on_rework:
      transition: ai-develop
      max_loop_count: 3
    allow_retry: true
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 7: Апрув итогового кода ──────────────────────────────────────────
  - id: approve-final-code
    title: Проверка и апрув итогового кода
    type: human_approval
    execution_context: []
    instruction: |
      Проверь итоговые изменения в кодовой базе и отчёт ревью в
      code-review-report.md.

      Убедись, что:
      - Реализация соответствует плану и требованиям
      - Все Critical и Required замечания ревью устранены
      - Билд проходит, тесты зелёные

      Апрувь для завершения флоу или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: terminal-complete
    on_rework:
      transition: ai-develop

  # ── Терминальная нода ─────────────────────────────────────────────────────
  - id: terminal-complete
    title: Разработка завершена
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
