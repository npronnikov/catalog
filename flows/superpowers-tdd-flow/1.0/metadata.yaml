description: >
  Цикл разработки по методологии Test-Driven Development (RED-GREEN-REFACTOR).
  Уточнение → план тест-кейсов → апрув → RED (падающие тесты) →
  GREEN (минимальная реализация) → REFACTOR (чистый код) → верификация → апрув.
  NO PRODUCTION CODE WITHOUT A FAILING TEST FIRST.
