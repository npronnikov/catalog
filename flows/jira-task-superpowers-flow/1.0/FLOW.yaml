  #     - taskKey: ключ задачи;
  #     - environment: контур задачи;
  #     - labelsToAdd: ["AIFIXED"];
  #     - commentBody: Markdown-комментарий со ссылкой на run.
  #
  #     Сохрани полный результат и историю операций в jira-finalization.json.
  #
  #     # Старый вариант перевода в конечный статус оставлен для быстрого переключения:
  #     # Нормализуй issueType через trim + uppercase:
  #     #
  #     # 1. Для TASK или ТАСКА передай в jira-issues:
  #     #    - taskKey: ключ задачи;
  #     #    - environment: контур задачи;
  #     #    - labelsToAdd: ["AIFIXED"];
  #     #    - transitionSequence: ["IN_PROGRESS", "Resolved"];
  #     #    - expectedFinalStatus: "Resolved".
  #     #
  #     # 2. Для BUG или БАГ передай в jira-issues:
  #     #    - taskKey: ключ задачи;
  #     #    - environment: контур задачи;
  #     #    - labelsToAdd: ["AIFIXED"];
  #     #    - transitionSequence:
  #     #      ["На исправлении", "Тестирование", "Подтверждение исправления"];
  #     #    - expectedFinalStatus: "Подтверждение исправления".
  #     #
  #     # Для другого issueType заверши ноду ошибкой: цепочка переходов не определена.
  #     #
  #     # После выполнения обязательно снова получи задачу через jira_get_issue и проверь:
  #     # - label AIFIXED присутствует;
  #     # - TASK находится в Resolved;
  #     # - BUG находится в "Подтверждение исправления".
