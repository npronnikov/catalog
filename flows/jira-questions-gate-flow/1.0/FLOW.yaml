id: jira-questions-gate-flow
version: "1.0"
canonical_name: jira-questions-gate-flow@1.0
title: JIRA Questions Gate — Вопросы и назначение задачи
description: >
  Объединённый flow: AI генерирует уточняющие вопросы в формате human-form,
  создаёт JIRA задачу с assignee по email на указанного человека, в указанном
  project и контуре (SIGMA/DELTA/SBERTRACK). Пользователь заполняет вопросы
  в gate UI, результат связывается с задачей через комментарий и финальный transition.
start_node_id: predefined-questions
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false
rule_refs: []

nodes:
  - id: predefined-questions
    title: Генерация уточняющих вопросов
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      <#assign humanFillForm = step["human-fill-form"]!{} />
      <#if humanFillForm.rework_instruction?has_content>
      Исправь форму по замечаниям:
      ${humanFillForm.rework_instruction!"(empty)"}
      <#else>
      <#if (run.feature_request)?? && run.feature_request?has_content>
      Запрос пользователя:
      ${run.feature_request}
      </#if>

      Сформулируй уточняющие вопросы и сохрани их в файл questions.form.json в рабочей директории.
      Строго следуй подключённому скиллу.
      </#if>
    skill_refs:
      - generate-form-questions@1.0
    produced_artifacts:
      - scope: run
        path: questions.form.json
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: create-jira-task

  - id: create-jira-task
    title: Создание или обновление задачи в JIRA
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        required: true
        scope: run
        transfer_mode: by_ref
        node_id: predefined-questions
        path: questions.form.json
        modifiable: false
      - type: artifact_ref
        required: false
        scope: run
        transfer_mode: by_ref
        node_id: create-jira-task
        path: jira-task.json
        modifiable: false
    instruction: |
      Прочитай файл questions.form.json.
      Сформируй текст комментария в формате Markdown. Для каждого field из массива fields:
      - label — текст вопроса (жирный, нумерованный список)
      - options — варианты ответа (вложенный маркированный список)
      - если options пустой — строка "* *"

      Шаблон комментария:

      ## Уточняющие вопросы

      1. **Текст первого вопроса?**
         * Вариант А
         * Вариант Б
      2. **Текст второго вопроса?**
         * Вариант В
         * Вариант Г

      Проверь, есть ли файл jira-task.json с непустым taskKey:
      - Если taskKey есть — обнови комментарий существующей задачи, не создавая новую.
      - Если taskKey нет — создай новую задачу и добавь комментарий.

      Аргументы для jira-issues:
      - environment: ${env.environment}
      - project: ${env.project}
      - assignee: ${env.assign}
      - summary: Необходимо ответить на вопросы
      - description: ${env.baseUrl}/#/run-console?runId=${run.id}
      - commentBody: сформированный Markdown-комментарий
      - taskKey: значение из jira-task.json, если файл существует
    skill_refs:
      - jira-issues@1.0
    produced_artifacts:
      - scope: run
        path: jira-task.json
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: human-fill-form

  - id: human-fill-form
    title: Заполнить форму с вопросами
    type: human_input
    execution_context:
      - type: artifact_ref
        required: true
        scope: run
        transfer_mode: by_ref
        node_id: predefined-questions
        path: questions.form.json
        modifiable: trueinstruction: |
      Заполни форму с уточняющими вопросами и нажми Submit.

      Если есть замечания по вопросам — нажми Rework и укажи, что изменить.
    allowed_roles:
      - PRODUCT_OWNER
    produced_artifacts:
      - scope: run
        path: questions.form.json
        required: true
    expected_mutations:
      - scope: run
        path: questions.form.json
        required: true
        modifications_allowed: ["value"]
    on_submit:
      transition: update-jira-task
    on_rework:
      transition: predefined-questions

  - id: update-jira-task
    title: Обновление JIRA задачи с ответами
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        required: true
        scope: run
        transfer_mode: by_ref
        node_id: human-fill-form
        path: questions.form.json
        modifiable: false
      - type: artifact_ref
        required: true
        scope: run
        transfer_mode: by_ref
        node_id: create-jira-task
        path: jira-task.json
        modifiable: false
    instruction: |
      Прочитай questions.form.json и jira-task.json.
      Сформируй текст комментария в формате Markdown. Для каждого field из массива fields:
      - label — вопрос (колонка "Вопрос")
      - value — фактический ответ пользователя (колонка "Ответ")
      Если value — массив (checkbox), объедини через запятую.
      Если value — null или пустое, пропусти поле.

      Шаблон комментария:

      ## Ответы на вопросы

      | Вопрос | Ответ |
      |--------|-------|
      | Текст вопроса | Ответ пользователя |

      Извлеки taskKey из jira-task.json.

      Выполни через скилл jira-issues:
        1) Добавь комментарий к задаче (commentBody = сформированный Markdown)
        2) Переведи задачу в конечный статус

      Аргументы:
      - environment: ${env.environment}
      - taskKey: taskKey из jira-task.json
      - commentBody: сформированный Markdown-комментарий
      - transitionMode: finalize
    skill_refs:
      - jira-issues@1.0
    produced_artifacts:
      - scope: run
        path: jira-task.json
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: terminal-complete

  - id: terminal-complete
    title: Завершение
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []