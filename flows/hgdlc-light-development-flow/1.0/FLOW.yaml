id: hgdlc-light-development-flow
version: "1.0"
canonical_name: hgdlc-light-development-flow@1.0
title: HGDLC Light Development Flow
description: >
  A lightweight development cycle with human participation at each key stage.
  Sequence: clarification questions → user answers → implementation plan →
  plan approval → development → adversarial review by three subagents →
  final code approval.
coding_agent: qwen
start_node_id: ai-clarifying-questions
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:

  # ── Шаг 1: Генерация уточняющих вопросов ─────────────────────────────────
  - id: ai-clarifying-questions
    title: Генерация уточняющих вопросов
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      <#assign humanAnswerQuestions = step["human-answer-questions"]!{} />
      <#if humanAnswerQuestions.rework_instruction?has_content && (humanAnswerQuestions.keep_changes!false)>
      Исправь ${humanAnswerQuestions.rework_instruction}
      <#else>
      <#if (run.feature_request)?? && run.feature_request?has_content>
      ${run.feature_request}
      </#if>

      Изучи кодовую базу проекта и запрос пользователя.
      Сформулируй 10–15 уточняющих вопросов,
      которые напрямую влияют на выбор решения. Строго следуй скилу.

      <#if humanAnswerQuestions.rework_instruction?has_content>
      ВАЖНО! При выполнении инструкции учти следующее: ${humanAnswerQuestions.rework_instruction}
      </#if>
      </#if>
    skill_refs:
      - hgdlc-ask-clarifying-questions@1.0
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-answer-questions
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 2: Ответы пользователя на вопросы ────────────────────────────────
  - id: human-answer-questions
    title: Ответы на уточняющие вопросы
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-clarifying-questions
        path: questions.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Открой questions.md.
      Отметь чекбокс у выбранного варианта в каждом вопросе.
      Если ни один вариант не выбран — будет использован рекомендуемый.
      Нажми Submit когда ответишь на все вопросы.
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-implementation-plan
    on_rework:
      transition: ai-clarifying-questions

  # ── Шаг 3: Построение плана имплементации ────────────────────────────────
  - id: ai-implementation-plan
    title: Построение плана имплементации
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: human-answer-questions
        path: questions.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveImplementationPlan = step["approve-implementation-plan"]!{} />
      <#if approveImplementationPlan.rework_instruction?has_content && (approveImplementationPlan.keep_changes!false)>
      Исправь ${approveImplementationPlan.rework_instruction}
      <#else>
      Изучи запрос пользователя и ответы на уточняющие вопросы из questions.md.
      Исследуй кодовую базу проекта: структуру пакетов, существующие паттерны,
      миграции, тесты.
      Сохрани результат в implementation-plan.md.

      <#if approveImplementationPlan.rework_instruction?has_content>
      Важно: при выполнении инструкции учти следующее: ${approveImplementationPlan.rework_instruction}
      </#if>
      </#if>
    skill_refs:
      - hgdlc-implementation-plan@1.0
    produced_artifacts:
      - scope: run
        path: implementation-plan.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-implementation-plan
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 4: Апрув плана имплементации ─────────────────────────────────────
  - id: approve-implementation-plan
    title: Проверка и апрув плана имплементации
    type: human_approval
    execution_context: []
    instruction: |
      Проверь план имплементации в файле implementation-plan.md.

      Убедись, что:
      - Все затронутые файлы перечислены с пометкой Create или Modify 
      - Порядок слоёв корректен (миграции → сущности → репозитории → сервисы →
        контроллеры → тесты → конфигурация)
      - Каждый шаг содержит конкретное описание изменения
      - Команды верификации реалистичны для данного проекта

      Утверди для начала разработки или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-develop
    on_rework:
      transition: ai-implementation-plan

  # ── Шаг 5: Разработка ─────────────────────────────────────────────────────
  - id: ai-develop
    title: Реализация по плану
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-implementation-plan
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-code-review
        path: code-review-report.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign aiCodeReview = step["ai-code-review"]!{} />
      <#if aiCodeReview.route?has_content && aiCodeReview.route == "on_rework">
      Изучи отчёт ревью в code-review-report.md из предыдущего шага.
      Устрани все блокирующие замечания severity critical и major из
      консолидированной секции отчёта и из секций отдельных сабагентов.

      Используй именно code-review-report.md как источник замечаний для
      доработки. Не ожидай rework_instruction и не придумывай отдельный
      список правок вне отчёта.
      <#else>
      Выполни план имплементации из implementation-plan.md шаг за шагом:
        - Находи первый невыполненный шаг [ ] и реализуй его.
        - После выполнения помечай шаг [x] и обновляй implementation-plan.md.
      </#if>

      Общие правила выполнения:
        - После каждого слоя запускай только завершающуюся команду верификации
          из плана: build / compile / test / lint.
        - Не используй для верификации долгоживущие процессы и ручные проверки:
          `./gradlew bootRun`, `npm run dev`, dev server, browser, `curl` к
          локально поднятым сервисам и аналогичные команды запрещены.
        - Не создавай копии файлов с суффиксами _modified, _new и т.п. —
          изменяй файлы непосредственно.
    skill_refs: []
    produced_artifacts: []
    expected_mutations: []
    on_success:
      transition: ai-code-review

  # ── Шаг 6: Ревью кода ─────────────────────────────────────────────────────
  - id: ai-code-review
    title: Adversarial ревью кода тремя сабагентами
    type: ai
    routing_type: dynamic
    execution_context:
      - type: artifact_ref
        node_id: ai-implementation-plan
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: human-answer-questions
        path: questions.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    subagent_refs:
      - aidlc-qwen-review-blind-hunter@1.0
      - aidlc-qwen-review-edge-case-hunter@1.0
      - aidlc-qwen-review-acceptance-auditor@1.0
    instruction: |
      Проведи adversarial-ревью только изменений в рабочем дереве проекта
      относительно текущего HEAD, то есть текущего незакоммиченного diff после
      шага разработки. Не ревьюй кодовую базу "в целом" — ревьюй только
      сделанные изменения.

      Считай implementation-plan.md основным источником требований, а
      questions.md — источником уточняющих ограничений, договорённостей и
      решений пользователя.

      Запусти три независимых прохода ревью без общего контекста между
      ревьюерами. Если сабагенты доступны — используй связанные subagent_refs.
      Если запуск сабагентов невозможен, выполни те же три прохода
      последовательно, но изолированно по ролям:
      1. Blind hunter — смотрит только на diff и ищет явные дефекты,
         регрессии и опасные изменения.
      2. Edge-case hunter — смотрит на diff и соседний код, ищет пропущенные
         случаи, контракты, негативные сценарии и интеграционные риски.
      3. Acceptance auditor — сверяет diff против implementation-plan.md и
         questions.md, проверяет полноту реализации и отсутствие выхода за scope.

      В каждом проходе обязательно оцени:
      - корректность и регрессии поведения
      - читаемость и сопровождаемость
      - архитектурные нарушения
      - безопасность и эксплуатационные риски
      - производительность, если она затронута изменением
      - полноту относительно implementation-plan.md
      - противоречия answers из questions.md
      - лишние изменения вне согласованного scope

      В секции Verification учитывай только завершающиеся команды сборки,
      компиляции, тестов и линтеров. Не требуй и не ожидай запуск backend /
      frontend, browser-based проверки или `curl` к локально поднятым сервисам.

      Если изменений относительно HEAD нет, явно укажи это в отчёте и не
      придумывай замечания.

      Сохрани консолидированный отчёт в code-review-report.md в структуре:
      - Executive summary
      - Reviewer 1: Blind hunter
      - Reviewer 2: Edge-case hunter
      - Reviewer 3: Acceptance auditor
      - Consolidated findings
      - Verification
      - Verdict

      После завершения ревью заполни step-summary.
      Добавь в step-summary для этой ноды:
      - route: "on_rework" если есть замечания severity "critical" или "major"; "on_success" если только "minor" / "info" или замечаний нет
      - actions: непустой массив выполненных действий ревью
      - issues: массив консолидированных замечаний (пустой если нет; для on_rework — минимум одно замечание)
      - report_path: "code-review-report.md"

      Примеры заполнения:
      - actions: ["запустил три независимых прохода ревью", "собрал консолидированный отчёт по замечаниям"]
      - route: "on_rework"
      - issues: [
        {"severity": "critical", "file": "path/to/File.java", "line": 42, "message": "описание проблемы", "reviewer": "blind-hunter"},
        {"severity": "major", "file": "path/to/File.java", "message": "описание проблемы", "reviewer": "acceptance-auditor"}
        ]
      - report_path: "code-review-report.md"

    skill_refs: []
    produced_artifacts:
      - scope: run
        path: code-review-report.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-final-code
    on_rework:
      transition: ai-develop
      keep_changes: true
      session_policy: resume_previous_session
      max_loop_count: 3
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 7: Апрув итогового кода ──────────────────────────────────────────
  - id: approve-final-code
    title: Проверка и апрув итогового кода
    type: human_approval
    execution_context: []
    instruction: |
      Проверь итоговые изменения в кодовой базе и отчёт ревью в
      code-review-report.md.

      Убедись, что:
      - Реализация соответствует плану и требованиям
      - Все Critical и Required замечания ревью устранены
      - Билд проходит, тесты зелёные

      Апрувь для завершения флоу или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: terminal-complete
    on_rework:
      transition: ai-develop

  # ── Терминальная нода ─────────────────────────────────────────────────────
  - id: terminal-complete
    title: Разработка завершена
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
