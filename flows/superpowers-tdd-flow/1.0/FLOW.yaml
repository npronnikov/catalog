id: superpowers-tdd-flow
version: "1.0"
canonical_name: superpowers-tdd-flow@1.0
title: Superpowers TDD Flow
description: >
  Upstream-aligned цикл разработки по методологии Superpowers.
  Последовательность: уточнение запроса → implementation plan →
  апрув плана → исполнение плана с TDD внутри каждого поведения →
  верификация → финальный апрув.
  TDD выполняется на уровне шагов реализации, а не как отдельные глобальные
  RED/GREEN/REFACTOR фазы на всю фичу.
coding_agent: qwen
start_node_id: ai-clarifying-questions
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:

  # ── Шаг 1: Уточняющие вопросы ────────────────────────────────────────────
  - id: ai-clarifying-questions
    title: Генерация уточняющих вопросов
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      <#assign humanAnswerQuestions = step["human-answer-questions"]!{} />
      <#if humanAnswerQuestions.rework_instruction?has_content && (humanAnswerQuestions.keep_changes!false)>
      Исправь ${humanAnswerQuestions.rework_instruction}
      <#else>
      <#if (run.feature_request)?? && run.feature_request?has_content>
      ${run.feature_request}
      </#if>

      Изучи кодовую базу проекта и запрос пользователя.
      Сформулируй 10–15 уточняющих вопросов, которые напрямую влияют на
      выбор решения. Строго следуй скилу.

      Особое внимание для upstream-aligned TDD-флоу:
      - Какие части задачи образуют отдельные поведения, для которых нужны
        независимые TDD-циклы?
      - Какой тестовый фреймворк и стиль focused test command уже используются?
      - Нужен ли общий implementation plan до начала кодирования?
      - Есть ли ограничения на scope, которые должны быть отражены в плане?

      <#if humanAnswerQuestions.rework_instruction?has_content>
      ВАЖНО! Учти следующее: ${humanAnswerQuestions.rework_instruction}
      </#if>
      </#if>
    skill_refs:
      - hgdlc-ask-clarifying-questions@1.0
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-answer-questions
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 2: Ответы пользователя ───────────────────────────────────────────
  - id: human-answer-questions
    title: Ответы на уточняющие вопросы
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-clarifying-questions
        path: questions.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Открой questions.md.
      Отметь чекбокс у выбранного варианта в каждом вопросе.
      Если ни один вариант не выбран — будет использован рекомендуемый.
      Нажми Submit когда ответишь на все вопросы.
    produced_artifacts:
      - scope: run
        path: questions.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-writing-plans
    on_rework:
      transition: ai-clarifying-questions

  # ── Шаг 3: Implementation Plan ───────────────────────────────────────────
  - id: ai-writing-plans
    title: Составление implementation plan
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: human-answer-questions
        path: questions.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approvePlan = step["approve-plan"]!{} />
      <#if approvePlan.rework_instruction?has_content && (approvePlan.keep_changes!false)>
      Исправь ${approvePlan.rework_instruction}
      <#else>
      Изучи запрос пользователя и ответы из questions.md.
      Исследуй кодовую базу: структуру проекта, существующие тесты, test utilities,
      build/test команды и паттерны слоёв.

      Составь implementation plan и сохрани его в implementation-plan.md.

      Требования для upstream-aligned TDD:
      - implementation-plan.md — основной артефакт плана для всей фичи
      - Не создавай отдельный tdd-plan.md как обязательный артефакт
      - Для каждого testable behavior планируй focused TDD цикл:
        write failing test → verify RED → minimal implementation →
        verify GREEN → small refactor while green
      - TDD должен происходить внутри исполнения плана, а не отдельной
        глобальной RED/GREEN/REFACTOR фазой на весь scope
      - Верификация — только завершающиеся команды

      <#if approvePlan.rework_instruction?has_content>
      Важно: учти следующее: ${approvePlan.rework_instruction}
      </#if>
      </#if>
    skill_refs:
      - superpowers-writing-plans@1.0
    produced_artifacts:
      - scope: run
        path: implementation-plan.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-plan
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 4: Апрув implementation plan ─────────────────────────────────────
  - id: approve-plan
    title: Проверка и апрув implementation plan
    type: human_approval
    execution_context: []
    instruction: |
      Проверь implementation plan в файле implementation-plan.md.

      Убедись, что:
      - План покрывает весь согласованный scope
      - implementation-plan.md является основным артефактом плана
      - Для каждого testable behavior есть focused TDD цикл
      - Нет отдельных глобальных фаз "сначала весь RED, потом весь GREEN"
      - Команды верификации — завершающиеся
      - Нет плейсхолдеров и двусмысленных шагов

      Апрувь для начала исполнения или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-executing-plans
    on_rework:
      transition: ai-writing-plans

  # ── Шаг 5: Исполнение плана с TDD внутри ─────────────────────────────────
  - id: ai-executing-plans
    title: Исполнение implementation plan с TDD
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-writing-plans
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-verify-before-completion
        path: verification-report.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign verifyBeforeCompletion = step["ai-verify-before-completion"]!{} />
      <#if verifyBeforeCompletion.rework_instruction?has_content>
      ${verifyBeforeCompletion.rework_instruction}
      <#else>
      Выполни implementation plan из implementation-plan.md.

      Важно для upstream-aligned TDD:
      - Следуй плану как основному артефакту
      - Для каждого поведения / focused test в плане выполняй локальный TDD цикл:
        RED → verify RED → GREEN → verify GREEN → small REFACTOR
      - Не группируй все RED-тесты задачи в одну глобальную фазу
      - Не группируй всю реализацию задачи в одну глобальную GREEN-фазу
      - После каждого локального цикла сохраняй зелёное состояние

      Если встречаешь blocker, не импровизируй вокруг плана — сообщи о нём.
      </#if>
    skill_refs:
      - superpowers-executing-plans@1.0
      - superpowers-test-driven-development@1.0
    produced_artifacts: []
    expected_mutations: []
    on_success:
      transition: ai-verify-before-completion

  # ── Шаг 6: Верификация перед завершением ─────────────────────────────────
  - id: ai-verify-before-completion
    title: Верификация перед завершением
    type: ai
    routing_type: dynamic
    execution_context:
      - type: artifact_ref
        node_id: ai-writing-plans
        path: implementation-plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Проведи верификацию перед завершением.
      Строго следуй скилу — каждый шаг обязателен.

      Верификационный чеклист для upstream-aligned TDD-флоу:
      1. Все [ ] в implementation-plan.md теперь [x]
      2. Focused TDD циклы действительно были исполнены по поведению, а не
         заменены одной глобальной фазой
      3. Все новые тесты зелёные
      4. Все существующие тесты зелёные — нет регрессий
      5. Полный build проходит с нулём ошибок
      6. Нет backup-копий файлов, debug-кода, TODO в production-коде
      7. Нет изменений вне согласованного scope

      После проверки заполни step-summary:
      - route: "on_success" если всё прошло
      - route: "on_rework" если есть проблемы
    skill_refs:
      - superpowers-verification-before-completion@1.0
    produced_artifacts:
      - scope: run
        path: verification-report.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-final-code
    on_rework:
      transition: ai-executing-plans
      keep_changes: true
      session_policy: resume_previous_session
      max_loop_count: 3
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 7: Финальный апрув ───────────────────────────────────────────────
  - id: approve-final-code
    title: Финальный апрув TDD-реализации
    type: human_approval
    execution_context: []
    instruction: |
      Проверь итоговые изменения и verification-report.md.

      Убедись, что:
      - Все шаги implementation-plan.md закрыты
      - TDD применялся внутри шагов реализации
      - Build и тесты зелёные
      - Изменения соответствуют согласованному scope
      - Нет явного возврата к batch-TDD модели

      Апрувь для завершения флоу или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: terminal-complete
    on_rework:
      transition: ai-executing-plans

  # ── Терминальная нода ─────────────────────────────────────────────────────
  - id: terminal-complete
    title: TDD-цикл завершён
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
