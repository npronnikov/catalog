id: aidlc-release-flow
version: "2.0"
canonical_name: aidlc-release-flow@2.0
title: AIDLC v2 Release
description: Immutable candidate readiness, human-gated deployment, observed validation, human-gated rollback, and final release record.
coding_agent: qwen
start_node_id: ai-release-readiness
failure_node_id: terminal-failed
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:
  - id: ai-release-readiness
    title: Establish and audit release readiness
    type: ai
    routing_type: dynamic
    execution_context: []
    subagent_refs:
      - aidlc-qwen-release-safety-auditor@2.0
      - aidlc-qwen-platform-sre-reviewer@2.0
    instruction: |
      First create root input-manifest.yaml with the exact immutable candidate identity
      (version and/or digest), repository revision, target account/project/cluster and
      environment, selected deployment procedure, selected rollback procedure, and exact
      evidence paths. Never infer latest/default state. Write release/candidate.yaml.
      Missing candidate identity, target identity, procedure, or evidence is blocking.

      Invoke both named regular Qwen subagents in the foreground:

      agent(
        description="Audit release safety",
        prompt="Audit the exact candidate, target, approvals, dependencies, migrations, validation thresholds, and rollback procedure. Never deploy or rollback. Return evidence-based findings and an APPROVE or BLOCKED verdict.",
        subagent_type="aidlc-qwen-release-safety-auditor",
        run_in_background=false
      )
      agent(
        description="Review release operations readiness",
        prompt="Review target capacity, health, observability, ownership, runbooks, deployment behavior, and recovery readiness. Never mutate external state. Return findings and an APPROVE or BLOCKED verdict.",
        subagent_type="aidlc-qwen-platform-sre-reviewer",
        run_in_background=false
      )

      Wait for each inline result and for both before continuing. Fail this node if an
      invocation fails, output is empty, or a required verdict is missing. Do not replace
      a failed subagent with inline self-review. Do not use fork, background agents,
      list_agents, or send_message. Preserve results in reviews/release-safety-readiness.md
      and reviews/release-sre-readiness.md. Apply the release-readiness skill and write
      release/readiness-report.md. For READY plus two approving verdicts write
      step-summary.json with {"route":"on_success"}; otherwise write
      {"route":"on_blocked"}. Never include credentials or secret values.
    skill_refs: [aidlc-release-readiness@2.0]
    produced_artifacts:
      - {scope: run, path: input-manifest.yaml, required: true, modifiable: false}
      - {scope: run, path: release/candidate.yaml, required: true, modifiable: false}
      - {scope: run, path: reviews/release-safety-readiness.md, required: true, modifiable: false}
      - {scope: run, path: reviews/release-sre-readiness.md, required: true, modifiable: false}
      - {scope: run, path: release/readiness-report.md, required: true, modifiable: false}
    expected_mutations: []
    on_success: {transition: human-approve-deployment}
    on_blocked: {transition: terminal-failed}
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: human-approve-deployment
    title: Authorize exact deployment
    type: human_approval
    execution_context:
      - {type: artifact_ref, node_id: ai-release-readiness, path: release/readiness-report.md, scope: run, required: true, modifiable: false, transfer_mode: by_ref}
    instruction: |
      Review the immutable candidate and target identities, readiness evidence, migration,
      validation window, abort conditions, and rollback procedure. Approve to authorize
      exactly one execution of the selected deployment procedure against that target, or
      request readiness rework. Approval does not pre-authorize rollback.
    produced_artifacts: []
    expected_mutations: []
    on_approve: {transition: ai-execute-deployment}
    on_rework: {transition: ai-release-readiness}

  - id: ai-execute-deployment
    title: Execute approved deployment once
    type: ai
    routing_type: static
    execution_context:
      - {type: artifact_ref, node_id: ai-release-readiness, path: input-manifest.yaml, scope: run, required: true, transfer_mode: by_value}
    instruction: |
      Apply the release-execution skill. Before mutation, use safe read-only commands to
      revalidate candidate, target, current version, and the human approval evidence.
      Stop on any mismatch. Execute the approved deployment procedure exactly once; do
      not automatically retry destructive, failed, partial, or non-idempotent commands.
      Write release/deployment-log.md with timestamps, redacted command, actual exit code,
      observed state transition, abort signal, and deviations. Never log secrets.
    skill_refs: [aidlc-release-execution@2.0]
    produced_artifacts:
      - {scope: run, path: release/deployment-log.md, required: true, modifiable: false}
    expected_mutations: []
    on_success: {transition: ai-validate-release}

  - id: ai-validate-release
    title: Observe and route release outcome
    type: ai
    routing_type: dynamic
    execution_context:
      - {type: artifact_ref, node_id: ai-execute-deployment, path: release/deployment-log.md, scope: run, required: true, transfer_mode: by_ref}
    subagent_refs:
      - aidlc-qwen-release-safety-auditor@2.0
      - aidlc-qwen-platform-sre-reviewer@2.0
    instruction: |
      Apply the release-validation-recovery skill. Run actual approved smoke, health,
      telemetry, functional, migration, and compatibility checks over the full observation
      window; preserve commands, timestamps, measurements, exit codes, and alerts in
      release/validation-results.md.

      Then invoke both named regular Qwen subagents in the foreground:

      agent(
        description="Audit observed release safety",
        prompt="Audit the exact deployment log and observed validation against candidate, target, migration, abort, and rollback criteria. Never deploy or rollback. Return findings and an APPROVE or BLOCKED verdict.",
        subagent_type="aidlc-qwen-release-safety-auditor",
        run_in_background=false
      )
      agent(
        description="Review observed release operations",
        prompt="Review health, telemetry, capacity, alerts, dependency state, and recovery readiness from actual post-deployment evidence. Never mutate external state. Return findings and an APPROVE or BLOCKED verdict.",
        subagent_type="aidlc-qwen-platform-sre-reviewer",
        run_in_background=false
      )

      Wait for each inline result and for both before routing. Fail this node if an
      invocation fails, output is empty, or a required verdict is missing. Do not replace
      a failed subagent with inline self-review. Do not use fork, background agents,
      list_agents, or send_message. Write reviews/release-safety-validation.md and
      reviews/release-sre-validation.md. If every acceptance criterion passes and both
      verdicts approve, write release/outcome.yaml with `outcome: ACCEPTED` and
      step-summary.json with {"route":"on_accept"}. Otherwise do not claim a final
      outcome and write {"route":"on_rollback"}.
    skill_refs: [aidlc-release-validation-recovery@2.0]
    produced_artifacts:
      - {scope: run, path: release/validation-results.md, required: true, modifiable: false}
      - {scope: run, path: reviews/release-safety-validation.md, required: true, modifiable: false}
      - {scope: run, path: reviews/release-sre-validation.md, required: true, modifiable: false}
      - {scope: run, path: release/outcome.yaml, required: false, modifiable: false}
    expected_mutations: []
    on_accept: {transition: human-approve-release-outcome}
    on_rollback: {transition: human-approve-rollback}
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: human-approve-release-outcome
    title: Accept observed release outcome
    type: human_approval
    execution_context:
      - {type: artifact_ref, node_id: ai-validate-release, path: release/validation-results.md, scope: run, required: true, modifiable: false, transfer_mode: by_ref}
    instruction: |
      Review the deployment log, full observation evidence, independent reviews, and
      proposed ACCEPTED outcome. Approve to publish the immutable release record, or
      request validation rework. This gate cannot authorize a new deployment.
    produced_artifacts: []
    expected_mutations: []
    on_approve: {transition: ai-publish-release}
    on_rework: {transition: ai-validate-release}

  - id: human-approve-rollback
    title: Authorize exact rollback
    type: human_approval
    execution_context:
      - {type: artifact_ref, node_id: ai-validate-release, path: release/validation-results.md, scope: run, required: true, modifiable: false, transfer_mode: by_ref}
    instruction: |
      Review failed acceptance evidence, current exact target state, rollback trigger,
      selected rollback procedure, data consequences, and recovery checks. Approve to
      authorize exactly one rollback execution, or request validation rework. Do not use
      approval for a different target or candidate.
    produced_artifacts: []
    expected_mutations: []
    on_approve: {transition: ai-execute-rollback}
    on_rework: {transition: ai-validate-release}

  - id: ai-execute-rollback
    title: Execute approved rollback once
    type: ai
    routing_type: static
    execution_context:
      - {type: artifact_ref, node_id: ai-validate-release, path: release/validation-results.md, scope: run, required: true, transfer_mode: by_ref}
    instruction: |
      Apply the release-execution skill. Before mutation, use safe read-only commands to
      revalidate target identity, current partial/deployed state, selected rollback, and
      this rollback approval. Stop on mismatch. Execute the approved rollback exactly
      once; never automatically retry. Write release/rollback-execution-log.md with
      timestamps, redacted command, actual exit code, observed transition, partial
      failures, and deviations. Never log credentials or secret values.
    skill_refs: [aidlc-release-execution@2.0]
    produced_artifacts:
      - {scope: run, path: release/rollback-execution-log.md, required: true, modifiable: false}
    expected_mutations: []
    on_success: {transition: ai-verify-rollback}

  - id: ai-verify-rollback
    title: Verify recovered state
    type: ai
    routing_type: dynamic
    execution_context:
      - {type: artifact_ref, node_id: ai-execute-rollback, path: release/rollback-execution-log.md, scope: run, required: true, transfer_mode: by_ref}
    instruction: |
      Apply the release-validation-recovery skill. Independently observe the exact target
      version/state, data consistency, health, telemetry, alerts, and residual impact.
      Write release/rollback-report.md with actual commands, exit codes, measurements,
      recovered identity, and gaps. Only if all mandatory recovery criteria pass, write
      release/outcome.yaml with exact `outcome: ROLLED_BACK` and step-summary.json with
      {"route":"on_success"}. If rollback is failed or partial, do not label it successful;
      write {"route":"on_blocked"} and retain all emergency follow-up evidence.
    skill_refs: [aidlc-release-validation-recovery@2.0]
    produced_artifacts:
      - {scope: run, path: release/rollback-report.md, required: true, modifiable: false}
      - {scope: run, path: release/outcome.yaml, required: true, modifiable: false}
    expected_mutations: []
    on_success: {transition: ai-publish-release}
    on_blocked: {transition: terminal-failed}
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: ai-publish-release
    title: Publish immutable release record
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      Publish the exact non-secret final state beneath the approved release ID as
      aidlc-docs/releases/*/release-record.md and evidence.yaml. Include immutable
      candidate and target identities, approvals, deployment outcome, validation,
      optional rollback and residual risks. The record describes observed external
      state; never claim the project filesystem itself represents production state.
      Verify all evidence links and redact credentials, tokens, keys, and sensitive dumps.
    skill_refs: [aidlc-release-validation-recovery@2.0]
    produced_artifacts:
      - {scope: project, path: aidlc-docs/releases/*/release-record.md, required: true, modifiable: false}
      - {scope: project, path: aidlc-docs/releases/*/evidence.yaml, required: true, modifiable: false}
    expected_mutations: []
    on_success: {transition: terminal-complete}
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: terminal-complete
    title: Release outcome recorded
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []

  - id: terminal-failed
    title: Release blocked or recovery incomplete
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
