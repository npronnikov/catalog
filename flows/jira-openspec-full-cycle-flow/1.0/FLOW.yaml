id: jira-openspec-full-cycle-flow
version: "1.0"
canonical_name: jira-openspec-full-cycle-flow@1.0
title: JIRA OpenSpec Full Cycle — DeepSeek-V4-Flash-131k
description: >
  The flow finds exactly one JIRA issue by type, status, and assignee strictly
  through MCP (the jira-issues skill), formalizes it as an OpenSpec change
  request, runs the full OpenSpec cycle (explore → propose → apply → verify →
  archive), then adds the AIFIXED label and moves the issue to the final status
  according to its type-specific workflow.

start_node_id: ai-fetch-task
failure_node_id: terminal-failed
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false
rule_refs: []

nodes:

  # ════════════════════════════════════════════════════════════════════════════
  # Шаг 1 — Найти JIRA-задачу строго через MCP
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-fetch-task
    title: Найти одну JIRA-задачу в выбранном контуре через MCP
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      Найди ровно одну задачу в JIRA строго через skill jira-issues и MCP.

      Обязательные значения env:
      - environment: ${env.environment}
      - project: ${env.project}
      - assignee: ${env.assignee}
      - status: ${env.status}
      - issueType: ${env.issueType}

      Если любое значение отсутствует или пусто после trim, заверши ноду ошибкой.

      Нормализуй environment через trim + uppercase. Допустимы только:
      - DELTA — используй исключительно MCP-сервер Delta Atlassian;
      - SIGMA — используй исключительно MCP-сервер Sigma Atlassian;
      - SBERTRACK — используй исключительно MCP-сервер SberTrack Atlassian.

      Не выбирай контур по умолчанию и не переключайся на другой MCP-сервер,
      если выбранный сервер недоступен.

      Нормализуй assignee и построй JQL:
        project = "<project>"
        AND assignee = "<assignee>"
        AND status = "<status>"
        AND issuetype = "<issueType>"
        ORDER BY created ASC

      Если status или issueType содержит несколько значений через запятую,
      используй соответственно status in (...) или issuetype in (...).

      Передай в jira-issues:
      - environment: нормализованное значение ${env.environment}
      - jql: построенный JQL
      - maxResults: 1

      Требуется ровно один результат. После jira_search обязательно вызови
      jira_get_issue для найденного taskKey и получи актуальные summary,
      description и comments. Отсутствие комментариев допустимо.

      Сохрани полный результат в jira-task.json. В нём обязательны:
      ok, environment, project, taskKey, issueType, summary, description, comments,
      totalResults, issues и error.
    skill_refs:
      - jira-issues@1.0
    produced_artifacts:
      - scope: run
        path: jira-task.json
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: os-describe-change

  # ════════════════════════════════════════════════════════════════════════════
  # Шаг 2 — OpenSpec DeepSeek-V4-Flash-131k полный цикл
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 1 — Описание изменения
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-describe-change
    title: OpenSpec — формализация JIRA-задачи как изменения
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-fetch-task
        path: jira-task.json
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай jira-task.json и формализуй найденную JIRA-задачу как OpenSpec change-request.

      Если ok != true или taskKey отсутствует, заверши ноду ошибкой.
      Используй summary как основной заголовок изменения, description как описание задачи,
      comments как дополнительный контекст. Отсутствие comments допустимо.

      Создай файл change-request.md и запиши в нём:

      # Change Request

      ## Название изменения (kebab-case)
      <!-- Построй стабильное имя из taskKey и summary, например jira-abc-123-fix-login -->
      <change-name>:

      ## Что нужно сделать
      Конкретное описание из summary, description и comments.

      ## Зачем
      Бизнес-контекст, проблема или возможность из JIRA-задачи.

      ## Дополнительный контекст
      Укажи environment, project, taskKey, issueType, важные ограничения, связанные
      компоненты, риски и значимые комментарии из JIRA.
    produced_artifacts:
      - scope: run
        path: change-request.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: os-explore
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 2 — Исследование идеи и текущих спецификаций
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-explore
    title: Исследование идеи и текущих спецификаций
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: os-describe-change
        path: change-request.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveExploration = step["os-approve-exploration"]!{} />
      <#if approveExploration.rework_instruction?has_content && (approveExploration.keep_changes!false)>
      Исследуй глубже: ${approveExploration.rework_instruction}
      <#else>
      Прочитай описание изменения из change-request.md.
      Следуй приложенному скилу.

      Исследуй:
      1. Текущие спецификации в openspec/specs/ — что уже задокументировано, что затронет изменение
      2. Кодовую базу при необходимости — для заземления обсуждения
      3. Уточни скоуп, риски, варианты подхода

      Зафиксируй результаты исследования в exploration-notes.md:
      - Что нашёл в текущих specs (что уже есть, чего нет)
      - Кристаллизованное понимание проблемы
      - Рекомендуемый подход (если возник)
      - Открытые вопросы (если остались)
      - Предлагаемые capabilities (имена для delta-specs)
      </#if>
    skill_refs:
      - openspec-explore@1.0
    produced_artifacts:
      - scope: run
        path: exploration-notes.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: os-approve-exploration
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 3 — Апрув скоупа исследования
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-approve-exploration
    title: Апрув скоупа изменения
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: os-explore
        path: exploration-notes.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Проверь результаты исследования в exploration-notes.md.

      Убедись что:
      - Скоуп изменения понят правильно
      - Затрагиваемые capabilities определены корректно
      - Подход звучит разумно
      - Нет пропущенных зависимостей или рисков

      Утверди для перехода к созданию артефактов,
      или верни на доработку с конкретным указанием что нужно исследовать глубже.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: os-propose
    on_rework:
      transition: os-explore

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 4 — Создание артефактов изменения
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-propose
    title: Создание артефактов изменения (proposal + specs + design + tasks)
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: os-describe-change
        path: change-request.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-explore
        path: exploration-notes.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveProposal = step["os-approve-proposal"]!{} />
      <#if approveProposal.rework_instruction?has_content && (approveProposal.keep_changes!false)>
      Доработай артефакты с учётом замечания: ${approveProposal.rework_instruction}
      <#else>
      Прочитай change-request.md и exploration-notes.md.
      Следуй приложенному скилу.

      Возьми название изменения из поля "change-name" в change-request.md.

      Создай в openspec/changes/<name>/:
      - proposal.md — что делаем и зачем
      - specs/<capability>/spec.md — delta-спецификации для каждой capability
      - specs-index.md — список активных delta-specs этого change
      - design.md — технические решения
      - tasks.md — чеклист реализации

      Для tasks.md правило обязательное:
      - В секцию Verification добавляй только завершающиеся команды проверки
        (тесты, сборка, компиляция, линтеры).
      - Не добавляй задачи на запуск системы или ручной smoke через долгоживущие процессы:
        `./gradlew bootRun`, `npm run dev`, `vite`, `docker compose up` и аналоги.
      - Не формулируй verification как "поднять backend/frontend и проверить руками".
      - Для этого репозитория предпочитай команды вида:
        `cd backend && ./gradlew test`, `cd backend && ./gradlew build`,
        `cd backend && ./gradlew compileJava`, `cd frontend && npm run build`

      После создания всех файлов создай proposal-summary.md с кратким резюме:
      - Название изменения и путь
      - Список capabilities и что они специфицируют
      - Количество задач
      - Ключевые технические решения из design.md
      </#if>
    skill_refs:
      - openspec-propose@1.0
    produced_artifacts:
      - scope: run
        path: proposal-summary.md
        required: true
        modifiable: false
      - scope: project
        path: "openspec/changes/*/proposal.md"
        required: true
        modifiable: false
      - scope: project
        path: "openspec/changes/*/design.md"
        required: true
        modifiable: false
      - scope: project
        path: "openspec/changes/*/tasks.md"
        required: true
        modifiable: false
      - scope: project
        path: "openspec/changes/*/specs-index.md"
        required: true
        modifiable: false
      - scope: project
        path: "openspec/changes/*/specs/*/spec.md"
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: os-approve-proposal
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 5 — Апрув артефактов изменения
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-approve-proposal
    title: Апрув артефактов изменения
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: os-propose
        path: proposal-summary.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Проверь артефакты созданного изменения.
      Сводка в proposal-summary.md, детали в openspec/changes/<name>/.

      Открой и проверь:
      - proposal.md — правильно ли сформулировано что и зачем?
      - specs/<cap>/spec.md — specs описывают ПОВЕДЕНИЕ (не реализацию)?
        Требования конкретные и тестируемые? Сценарии покрывают edge cases?
      - design.md — технические решения разумны? Ключевые решения зафиксированы?
      - tasks.md — задачи атомарные? Порядок по зависимостям?

      Утверди для перехода к реализации,
      или верни на доработку с конкретным замечанием (какой файл, что именно).
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: os-apply
    on_rework:
      transition: os-propose

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 6 — Реализация
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-apply
    title: Реализация по tasks.md
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: os-propose
        path: proposal-summary.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/proposal.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/tasks.md"
        scope: project
        required: true
        modifiable: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/design.md"
        scope: project
        required: false
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/specs-index.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveFinal = step["os-approve-final"]!{} />
      <#if approveFinal.rework_instruction?has_content && (approveFinal.keep_changes!false)>
      Устрани замечания и исправь реализацию: ${approveFinal.rework_instruction}
      <#else>
      Прочитай proposal-summary.md чтобы найти название изменения и путь.
      Следуй приложенному скилу.

      Используй уже переданные входные артефакты этого шага:
      - proposal.md — что именно меняем и зачем
      - specs-index.md — manifest активных delta-specs текущего change
      - design.md — технические решения и ограничения
      - tasks.md — чеклист реализации

      Используй specs-index.md как единственный список активных delta-specs этого change.
      Читай только те spec-файлы, которые перечислены в specs-index.md.

      Реализуй все задачи из tasks.md последовательно.
      Помечай каждую задачу выполненной (- [ ] → - [x]) сразу после завершения.
      </#if>
    skill_refs:
      - openspec-apply@1.0
    produced_artifacts: []
    expected_mutations:
      - scope: project
        path: "openspec/changes/*/tasks.md"
        required: true
    on_success:
      transition: os-verify
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 7 — Верификация реализации
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-verify
    title: Верификация реализации против спецификаций
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: os-propose
        path: proposal-summary.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/proposal.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/specs-index.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/design.md"
        scope: project
        required: false
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/tasks.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай proposal-summary.md чтобы найти название изменения и путь.
      Следуй приложенному скилу.

      Проверь реализацию по трём измерениям:
      - Полнота: все задачи выполнены, все требования реализованы
      - Корректность: код соответствует specs и сценариям
      - Согласованность: следует решениям из design.md

      Сохрани отчёт в verify-report.md.
    skill_refs:
      - openspec-verify@1.0
    produced_artifacts:
      - scope: run
        path: verify-report.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: os-approve-final
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 8 — Финальный акцепт
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-approve-final
    title: Финальный акцепт результата
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: os-verify
        path: verify-report.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Проверь отчёт верификации в verify-report.md.

      Убедись что:
      - Нет CRITICAL проблем (незавершённые задачи, нереализованные требования)
      - WARNING-и приняты осознанно или исправлены
      - Реализация работает корректно (проверь вручную если нужно)
      - Все задачи из tasks.md отмечены [x]

      Утверди для перехода к архивированию и актуализации документации,
      или верни на доработку с конкретным замечанием что нужно исправить.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: os-archive
    on_rework:
      transition: os-apply

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 9 — Актуализация документации и архивирование
  # ════════════════════════════════════════════════════════════════════════════

  - id: os-archive
    title: Актуализация документации и архивирование изменения
    type: ai
    model: vllm/DeepSeek-V4-Flash-131k
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: os-propose
        path: proposal-summary.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/tasks.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: os-propose
        path: "openspec/changes/*/specs-index.md"
        scope: project
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай proposal-summary.md чтобы найти название изменения и путь.
      Следуй приложенному скилу.

      Выполни два действия:

      1. Синхронизировать delta-specs в основную документацию:
         Используй specs-index.md как источник списка delta-specs текущего change.
         Для каждого spec-файла из specs-index.md
         примени изменения к openspec/specs/<capability>/spec.md
         (добавить/изменить/удалить требования согласно маркерам ADDED/MODIFIED/REMOVED).

      2. Архивировать папку изменения:
         Переместить openspec/changes/<name>/
         в openspec/changes/archive/YYYY-MM-DD-<name>/

      Покажи итог: что синхронизировано, куда заархивировано.
    skill_refs:
      - openspec-archive@1.0
    produced_artifacts:
      - scope: project
        path: "openspec/specs/*/spec.md"
        required: true
        modifiable: false
    expected_mutations:
      - scope: project
        path: "openspec/specs/*/spec.md"
        required: true
    on_success:
      transition: ai-finalize-jira
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ════════════════════════════════════════════════════════════════════════════
  # Финализация исходной JIRA-задачи после OpenSpec-цикла
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-finalize-jira
    title: Добавить AIFIXED и комментарий со ссылкой на run
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-fetch-task
        path: jira-task.json
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай jira-task.json и обнови исходную задачу.

      Используй skill jira-issues строго через MCP-сервер,
      выбранный по environment из jira-task.json.

      Обязательные данные:
      - environment из jira-task.json;
      - taskKey из jira-task.json.

      Сначала получи актуальную задачу через jira_get_issue.
      Добавь label "AIFIXED", не удаляя существующие labels.

      Передай в jira-issues:
      - taskKey: ключ задачи;
      - environment: контур задачи;
      - labelsToAdd: ["AIFIXED"];
      - commentBody: ${env.baseUrl}/#/run-console?runId=${run.id}

      После выполнения обязательно снова получи задачу через jira_get_issue и проверь:
      - label AIFIXED присутствует;
      - есть комментарий со ссылкой ${env.baseUrl}/#/run-console?runId=${run.id}.

      Сохрани полный результат и историю операций в jira-finalization.json.
    skill_refs:
      - jira-issues@1.0
    produced_artifacts:
      - scope: run
        path: jira-finalization.json
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: terminal-complete

