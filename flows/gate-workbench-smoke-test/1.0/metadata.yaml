description: "Детерминированный флоу для ручной проверки нового функционала работы с кодом и Gate: command-нода сеет файлы (код, markdown+mermaid, .mmd, .dbml, .svg, human-form опросник); human_input-гейт (редактирование + опросник Форма↔JSON + submit); human_approval-гейт (ревью диффа, Preview, rework-декорации/меню на Diff, approve/rework/takeover). Rework на approval уходит в ai-ноду (опциональная ветка)."
# Требуется валидным только если реально доходишь до ai-ноды (Rework на approval-гейте).
