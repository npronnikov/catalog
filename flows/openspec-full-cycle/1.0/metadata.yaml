title: OpenSpec Full Cycle — Explore, Propose, Apply, Verify, Archive
description: >
  Полный цикл OpenSpec-разработки: исследование идеи и текущих спецификаций →
  создание delta-specs и артефактов изменения → апрув → реализация кода →
  верификация → финальный акцепт → актуализация документации и архивирование.
  Результат: реализованная фича + актуализированные openspec/specs/.
