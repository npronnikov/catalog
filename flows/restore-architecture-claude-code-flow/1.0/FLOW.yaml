id: restore-architecture-java-claude-code-flow
version: "1.0"
canonical_name: restore-architecture-java-claude-code-flow@1.0
title: Restore architecture documentation (Java/C4) — Claude Code
description: >
  Analyzes a Java/Spring Boot project and generates C4 architecture
  documentation with Mermaid diagrams (Context, Container, Component).
  Human reviews and approves or requests corrections.
start_node_id: ai-analyze-architecture
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false
rule_refs:
  - java-backend-coding-standards-claude-code@1.0

nodes:
  - id: ai-analyze-architecture
    title: Analyze project and generate C4 architecture
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      <#assign approveArchitecture = step["approve-architecture"]!{} />
      <#if approveArchitecture.rework_instruction?has_content && (approveArchitecture.keep_changes!false)>
      Исправь ${approveArchitecture.rework_instruction}
      <#else>
      Изучи весь код проекта и подготовь архитектурную документацию
      в нотации модели C4 с использованием диаграмм Mermaid.

      Строго следуй подключенному skill.
      Сохрани результат в `docs/architecture.md` в директории проекта.

      <#if approveArchitecture.rework_instruction?has_content>
      Важно: при выполнении инструкции учти следующее: ${approveArchitecture.rework_instruction}
      </#if>
      </#if>
    skill_refs:
      - restore-c4-architecture-java-claude-code@1.0
    produced_artifacts:
      - scope: project
        path: docs/architecture.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-architecture

  - id: approve-architecture
    title: Review and approve architecture documentation
    type: human_approval
    execution_context: []
    instruction: |
      Просмотри сгенерированный `docs/architecture.md` в директории проекта.
      Проверь, что все контейнеры, компоненты и связи между ними описаны корректно.
      Подтверди, если документация точно отражает систему, либо запроси доработку
      с указанием того, что отсутствует или описано неверно.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: terminal-complete
    on_rework:
      transition: ai-analyze-architecture

  - id: terminal-complete
    title: Complete
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
