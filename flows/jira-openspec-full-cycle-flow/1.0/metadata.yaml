description: >
  The flow searches for a JIRA issue in the selected DELTA, SIGMA, or SBERTRACK
  environment by project, type, status, and assignee strictly through the
  corresponding MCP server (the jira-issues skill), formalizes the issue as an
  OpenSpec change request, runs the full OpenSpec cycle, and then moves the
  issue to the final status with the AIFIXED label.
