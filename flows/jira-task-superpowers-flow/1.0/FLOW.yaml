  - id: ai-finalize-jira
    title: Добавить AIFIXED и комментарий о run
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-fetch-task
        path: jira-task.json
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай jira-task.json и обнови исходную задачу.

      Используй skill jira-issues строго через MCP-сервер,
      выбранный по environment из jira-task.json.

      Обязательные данные:
      - environment из jira-task.json;
      - taskKey из jira-task.json;
      - issueType из верхнего уровня jira-task.json, либо issuetype/name из issues[0].

      Сначала получи актуальную задачу через jira_get_issue.
      Добавь label "AIFIXED", не удаляя существующие labels.

      Передай в jira-issues:
      - taskKey: ключ задачи;
      - environment: контур задачи;
      - labelsToAdd: ["AIFIXED"];
      - commentBody: ${env.baseUrl}/#/run-console?runId=${run.id}

      Сохрани полный результат и историю операций в jira-finalization.json.
    skill_refs:
      - jira-issues@1.0
    produced_artifacts:
      - scope: run
        path: jira-finalization.json
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: terminal-complete

  # ════════════════════════════════════════════════════════════════════════════
  # Терминал
  # ════════════════════════════════════════════════════════════════════════════

  - id: terminal-complete
    title: Flow завершён
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []

  - id: terminal-failed
    title: Flow завершён с ошибкой
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
