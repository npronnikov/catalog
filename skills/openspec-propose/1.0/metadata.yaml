display_name: "OpenSpec: Create change artifacts"
description: >
  Creates the full artifact set for an OpenSpec change in
  openspec/changes/<name>/: proposal.md (what and why),
  specs/<capability>/spec.md (delta-specifications), specs-index.md
  (the active delta-spec index), design.md (how), and tasks.md
  (the implementation checklist). These artifacts become the source of truth
  for implementation and later documentation updates.
