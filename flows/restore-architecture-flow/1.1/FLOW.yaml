id: restore-architecture-flow
version: "1.1"
canonical_name: restore-architecture-flow@1.1
title: Restore architecture flow
description: Flow to reconstruct architecture artifacts from code.
start_node_id: analyze-architecture
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: true
rule_refs:
  - java-backend-layering-and-validation@1.0

nodes:
  - id: analyze-architecture
    title: Analyze codebase architecture
    description: New version of architecture flow
    type: ai
    execution_context: []
    instruction: |
      Reconstruct architecture from the codebase.
      Produce C4 and sequence diagram summaries.
      
    checkpoint_before_run: true
    skill_refs:
      - restore-c4-architecture@1.0
      - restore-sequence-diagrams@1.0
    produced_artifacts:
      -
        scope: project
        path: docs/c-4.md
        required: true
      -
        scope: project
        path: docs/sequence.md
        required: true
    expected_mutations: []
    on_success: check-artefacts
    on_failure: complete
  - id: check-artefacts
    title: Check architecture artefacts
    type: human_approval
    execution_context: []
    instruction: |
      Check generated artifacts
    produced_artifacts: []
    expected_mutations: []
    on_approve: complete
    on_rework:
      next_node: analyze-architecture
  - id: complete
    title: Complete flow
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []