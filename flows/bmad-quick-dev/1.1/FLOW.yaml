id: bmad-quick-dev-flow
version: "1.1"
canonical_name: bmad-quick-dev-flow@1.1
title: BMAD Quick Dev — Clarify, Plan, Implement, Review, Present
description: >
  HGSDLC representation of the bmad-quick-dev workflow for full-cycle code development.
  Full cycle: intent clarification → spec planning with human approval →
  implementation → adversarial review (3 sub-agents) → rework routing →
  final presentation. Each stage has a human gate with rework capability.
  For zero-blast-radius changes use bmad-quick-dev-oneshot-flow instead.
start_node_id: ai-clarify-and-route
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 1 — Уточнение намерения
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-clarify-and-route
    title: Уточнить намерение и проверить состояние VCS
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      <#assign humanClarifyIntent = step["human-clarify-intent"]!{} />
      <#if humanClarifyIntent.rework_instruction?has_content>
      ВАЖНО! При выполнении инструкции учти следующее: ${humanClarifyIntent.rework_instruction}
      </#if>
     

      Проанализируй намерение пользователя:
      <#if (run.feature_request)?? && run.feature_request?has_content>
      ${run.feature_request}
      </#if>

      Выполни проверки по порядку:

      1. Сканирование артефактов планирования. Прочитай implementation_artifacts и
         planning_artifacts из _bmad/bmm/config.yaml, если файл существует (по умолчанию:
         _bmad-output/implementation-artifacts и _bmad-output/planning-artifacts).
         Найди в planning_artifacts файлы, соответствующие:
           - *prd*          — требования к продукту и критерии успеха
           - *architecture* — технические решения и ограничения
           - *ux*           — UX и дизайн взаимодействия
           - *epic*         — разбивка фич на истории
           - *brief*        — видение и скоп проекта
         Загружай избирательно — только документы, релевантные текущему намерению.
         Зафиксируй загруженные документы в clarification.md в разделе "Контекст планирования".

      2. Сканирование активных спек в implementation_artifacts. Найди артефакты реализации (спеки со статусом
         draft / ready-for-dev / in-progress / in-review). Если найдены — перечисли их
         в clarification.md и спроси пользователя, какой возобновить (или [N] для новой задачи).

      3. Проверка нескольких целей. Если намерение содержит >= 2 независимо поставляемые
         цели (каждую можно проревьювить, протестировать и смержить отдельным PR) —
         перечисли их и попроси пользователя выбрать первую для реализации.
         Отложенные цели добавь в clarification.md в раздел "Отложенные цели".

      4. Проверка VCS. Чистое ли рабочее дерево? Соответствует ли имя текущей ветки
         намерению? Зафиксируй выводы в clarification.md в разделе "Состояние VCS".

      5. Если что-то в намерении неоднозначно, запиши вопросы в clarification.md
         в разделе "Вопросы" в следующем формате:

         **N. <текст вопроса>**
         - [ ] <вариант А>
         - [ ] <вариант Б>
         - [ ] Свой вариант: ___

         Всегда добавляй "Свой вариант: ___" как последний вариант для каждого вопроса.
         Если намерение уже понятно — напиши "Вопросов нет — готов к планированию."

      Сохрани clarification.md в скопе артефактов run.
    skill_refs: []
    produced_artifacts:
      - scope: run
        path: clarification.md
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: human-clarify-intent

  - id: human-clarify-intent
    title: Ответить на уточняющие вопросы и подтвердить намерение
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-clarify-and-route
        path: clarification.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Открой clarification.md и ознакомься с выводами ИИ.

      - Если есть вопросы — заполни ответы прямо в файле.
      - Если найдены активные спеки — укажи, какой возобновить (или напиши "новый").
      - Если обнаружено несколько целей — подтверди первую для реализации.
      - Если есть замечания по VCS — подтверди или объясни состояние ветки.
      - Если "Вопросов нет" — просто нажми Submit.

      Можешь добавить ограничения или контекст, который ИИ упустил.
    produced_artifacts:
      - scope: run
        path: clarification.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-plan
    on_rework:
      transition: ai-clarify-and-route

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 2 — Планирование
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-plan
    title: Исследовать кодовую базу и написать спек реализации
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: human-clarify-intent
        path: clarification.md
        scope: run
        required: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-review
        path: review-report.md
        scope: run
        required: false
        transfer_mode: by_ref
    instruction: |
      <#assign humanApprovePlan = step["human-approve-plan"]!{} />
      <#assign aiRework = step["ai-route-rework"]!{} />

      <#if humanApprovePlan.rework_instruction?has_content && (humanApprovePlan.keep_changes!false)>
      ВАЖНО: ${humanApprovePlan.rework_instruction}
      </#if>

      <#if aiRework.rework_instruction?has_content>
        ОЦЕНЬ ВАЖНО! Прочитай файл review-report.md и учти все замечания с ошибкой bad_intent при создании спецификации spec.md
      </#if>

      
      
      Путь к implementation_artifacts читай из _bmad/bmm/config.yaml, если файл есть, если нет, то используй _bmad-output/implementation_artifacts/

      Исследуй кодовую базу, чтобы понять зону влияния изменений.
      Глубокое исследование выноси в суб-агентов, чтобы избежать раздувания контекста.

      Загрузи документы планирования, указанные в clarification.md в разделе "Контекст планирования".
      Извлеки из них ограничения, требования и архитектурные решения, релевантные текущему намерению —
      опирайся на них, а не угадывай из кода.

      Создай spec-scratchpad.json для временных заметок. Ничего лишего без явного указания в него не пишем!
      Derive a valid kebab-case slug from the clarified intent. If the intent references a tracking identifier (story number, issue number, ticket ID), lead the slug with it (e.g. `3-2-digest-delivery`, `gh-47-fix-auth`)
      Добавь в spec-scratchpad.json поле slug.

      Спеку пищи по-русски, если не задано другое.
      
      Заполни шаблон спеки и сохрани в _bmad-output/implementation_artifacts/spec.md:
      <TEMPLATE START>
      ---
      title: '{title}'
      type: 'feature' # feature | bugfix | refactor | chore
      created: '{date}'
      status: 'draft' # draft | ready-for-dev | in-progress | in-review | done
      context: [] # optional: `{project-root}/`-prefixed paths to project-wide standards/docs the implementation agent should load. Keep short — only what isn't already distilled into the spec body.
      ---

      <!-- Target: 900–1300 tokens. Above 1600 = high risk of context rot.
          Never over-specify "how" — use boundaries + examples instead.
          Cohesive cross-layer stories (DB+BE+UI) stay in ONE file.
          IMPORTANT: Remove all HTML comments when filling this template. -->
      
      <frozen-after-approval reason="human-owned intent — do not modify unless human renegotiates">
      
      ## Intent

      <!-- What is broken or missing, and why it matters. Then the high-level approach — the "what", not the "how". -->

      **Problem:** ONE_TO_TWO_SENTENCES

      **Approach:** ONE_TO_TWO_SENTENCES

      ## Boundaries & Constraints

      <!-- Two tiers: Always = invariant rules. Never = out of scope + forbidden approaches. -->

      **Always:** INVARIANT_RULES

      **Never:** NON_GOALS_AND_FORBIDDEN_APPROACHES

      ## I/O & Edge-Case Matrix

      <!-- If no meaningful I/O scenarios exist, DELETE THIS ENTIRE SECTION. Do not write "N/A" or "None". -->

      | Scenario | Input / State | Expected Output / Behavior | Error Handling |
      |----------|--------------|---------------------------|----------------|
      | HAPPY_PATH | INPUT | OUTCOME | N/A |
      | ERROR_CASE | INPUT | OUTCOME | ERROR_HANDLING |

      </frozen-after-approval>

      ## Code Map

      <!-- Agent-populated during planning. Annotated paths prevent blind codebase searching. -->

      - `FILE` -- ROLE_OR_RELEVANCE
      - `FILE` -- ROLE_OR_RELEVANCE

      ## Tasks & Acceptance

      <!-- Tasks: backtick-quoted file path -- action -- rationale. Prefer one task per file; group tightly-coupled changes when splitting would be artificial. -->
      <!-- If an I/O Matrix is present, include a task to unit-test its edge cases. -->
      <!-- AC covers system-level behaviors not captured by the I/O Matrix. Do not duplicate I/O scenarios here. -->

      **Execution:**
      - [ ] `FILE` -- ACTION -- RATIONALE

      **Acceptance Criteria:**
      - Given PRECONDITION, when ACTION, then EXPECTED_RESULT

      ## Spec Change Log

      <!-- Append-only. Populated by step-04 during review loops. Do not modify or delete existing entries.
          Each entry records: what finding triggered the change, what was amended, what known-bad state
          the amendment avoids, and any KEEP instructions (what worked well and must survive re-derivation).
          Empty until the first bad_spec loopback. -->

      ## Design Notes

      <!-- If the approach is straightforward, DELETE THIS ENTIRE SECTION. Do not write "N/A" or "None". -->
      <!-- Design rationale and golden examples only when non-obvious. Keep examples to 5–10 lines. -->

      DESIGN_RATIONALE_AND_EXAMPLES

      ## Verification

      <!-- If no build, test, or lint commands apply, DELETE THIS ENTIRE SECTION. Do not write "N/A" or "None". -->
      <!-- How the agent confirms its own work. Prefer CLI commands. When no CLI check applies, state what to inspect manually. -->

      **Commands:**
      - `COMMAND` -- expected: SUCCESS_CRITERIA

      **Manual checks (if no CLI):**
      - WHAT_TO_INSPECT_AND_EXPECTED_STATE
       <TEMPLATE END>
      
      Целевой объём: 900–1600 токенов. Если больше 1600 — сократи до основной цели
      и добавь отложенные цели в файл deferred-work проекта.
      
      Добавляй отложенные цели в {implementation_artifacts}/deferred-work.md
      Сохрани спеку в _bmad-output/implementation_artifacts/spec.md
    skill_refs: []
    produced_artifacts:
      - scope: project
        path: _bmad-output/implementation_artifacts/spec.md
        required: true
        modifiable: false
      - scope: run
        path: spec-scratchpad.json
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: human-approve-plan

  - id: human-approve-plan
    title: Проверить и утвердить спек реализации
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: ai-plan
        path: _bmad-output/implementation_artifacts/spec.md
        scope: project
        required: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-plan
        path: spec-scratchpad.json
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Проверь spec.md. Убедись, что:
        - Намерение зафиксировано корректно (после апрува будет заморожено)
        - У всех задач есть пути к файлам и чёткие действия Create/Modify
        - Критерии приёмки проверяемы (Given/When/Then)
        - Нет TBD и плейсхолдеров
        - Скоп разумный (диапазон 900–1600 токенов)

      Можешь открыть spec.md в редакторе и отредактировать напрямую перед апрувом.
      Для глубокой проверки запусти bmad-code-review или bmad-advanced-elicitation
      в отдельной сессии, чтобы не раздувать контекст.

      Апрувь для начала реализации или верни на доработку с конкретными замечаниями.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-implement
    on_rework:
      transition: ai-plan

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 3 — Реализация
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-implement
    title: Реализовать по утверждённому спеку
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-plan
        path: _bmad-output/implementation_artifacts/spec.md
        scope: project
        required: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-plan
        path: spec-scratchpad.json
        scope: run
        required: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-review
        path: review-report.md
        scope: run
        required: false
        transfer_mode: by_ref
    instruction: |      
      <#assign aiRework = step["ai-route-rework"]!{} />

      <#if aiRework.rework_instruction?has_content>
        ОЦЕНЬ ВАЖНО! Прочитай файл review-report.md и учти все замечания с ошибкой bad_spec при написании кода
      </#if>


      Прочитай _bmad-output/implementation_artifacts/spec.md. Далее просто spec.md. Если в frontmatter spec.md есть непустой context — загрузи
      эти файлы перед началом. При передаче суб-агенту включи их в промпт, чтобы
      суб-агент имел доступ к зафиксированным ограничениям.

      Запиши baseline_commit (текущий HEAD или NO_VCS) во frontmatter spec.md
      до внесения любых изменений.

      Измени статус spec.md на in-progress.

      Передай spec.md суб-агенту для реализации.
      Если суб-агенты недоступны — реализуй напрямую.

      Правила:
        - Содержимое внутри <frozen-after-approval> в spec.md — только для чтения.
        - Выполняй задачи по порядку. Отмечай каждую выполненную задачу [x] сразу в разделе Execution.
        - Brownfield: изменяй файлы на месте; никогда не создавай копии с суффиксами _modified и т.п.
        - Проверяй каждый шаг перед тем, как отметить [x].
        - НЕ пушь в remote.

      Самопроверка перед завершением: все задачи в ## Tasks & Acceptance
      должны быть [x]. Если что-то не выполнено — доделай перед продолжением.
    skill_refs: []
    produced_artifacts: []
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
    on_success:
      transition: ai-review

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 4 — Ревью
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-review
    title: Adversarial ревью — 3 суб-агента
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-plan
        path: _bmad-output/implementation_artifacts/spec.md
        scope: project
        required: true
        transfer_mode: by_ref
    instruction: |
      <#assign humanApproveReview = step["human-approve-review"]!{} />
      <#if humanApproveReview.rework_instruction?has_content>
      ВАЖНО! Пользователь вернул ревью на доработку и указал, что ревью было сделано
      некачественно. Его комментарий: ${humanApproveReview.rework_instruction}
      Учти это замечание при проведении ревью ниже — устрани именно то, что пользователь
      посчитал недостаточным или неверным.
      </#if>

      Измени статус spec.md на in-review.

      Построй diff (tracked + untracked) с момента baseline_commit из frontmatter spec.md.
      Если baseline_commit отсутствует или NO_VCS — используй best effort.
      НЕ запускай git add.

      Запусти три ревью без общего контекста разговора. Если доступны суб-агенты —
      запусти параллельно (той же мощности модели, что текущая сессия); иначе выполни
      каждое ревью последовательно в изолированных reasoning-проходах. В обоих случаях
      контекст между ревьюерами не разделяется:
        1. Слепой охотник — только diff, без спека, без доступа к проекту.
           Запустить через скил bmad-review-adversarial-general@1.0.
        2. Охотник за граничными случаями — diff + доступ к проекту на чтение.
           Запустить через скил bmad-review-edge-case-hunter@1.0.
        3. Аудитор приёмки — diff + spec.md + доступ к проекту.
           Обязан прочитать документы планирования из раздела context в frontmatter spec.md.
           Проверяет нарушения критериев приёмки, правил и принципов.

      Классифицируй все находки (дедуплицированные):
        - intent_gap: вызвано изменением, намерение в спеке неполное — требует переплан
        - bad_spec: вызвано изменением, спек должен был быть чётче — требует правки спека + перереализацию
        - patch: тривиально исправимо без участия человека — исправь сейчас
        - defer: существующая проблема, не вызванная этим изменением
        - reject: шум — отбросить без упоминания

      Авто-применяй все patch-находки.
      Добавляй defer-находки в <implementation_artifacts>/deferred-work.md.

      Запиши review-report.md с:
        - Таблицей классификации находок (находка | категория | действие)
        - Применёнными патчами
        - Отложенными пунктами
        - Рекомендацией: approve | rework-spec | rework-intent

      Если есть intent_gap или bad_spec находки — рекомендация rework-*, даже если патчи
      уже применены.

      Сохрани review-report.md в скопе артефактов run.

    skill_refs:
      - bmad-review-adversarial-general@1.0
      - bmad-review-edge-case-hunter@1.0
    produced_artifacts:
      - scope: run
        path: review-report.md
        required: true
        modifiable: false
    expected_mutations: []
    retry_policy:
      attempts: 2
      on_errors:
        - AGENT_EXECUTION_FAILED
        - AGENT_SESSION_RESUME_FAILED
        - NODE_VALIDATION_FAILED
    on_success:
      transition: human-approve-review

  - id: human-approve-review
    title: Проверить находки ревью и принять решение
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: ai-review
        path: review-report.md
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Открой review-report.md. Этот гейт появляется, когда AI-ревью выбрало
      route="on_success" и рекомендовало approve.

      ИИ уже:
        - Применил тривиальные патчи автоматически
        - Отложил существующие проблемы в deferred-work.md
        - Классифицировал остальные находки

      Расшифровка действий:
        Подтвердить (on_approve) — ревью проведено качественно; маршрутизатор подтвердит
          рекомендацию approve и переведёт флоу к презентации.
        Доработка (on_rework) — качество самого ревью недостаточно; укажи в комментарии,
          что именно упущено, и ревью будет проведено заново с учётом твоего замечания.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-route-rework
    on_rework:
      transition: ai-review

  - id: ai-route-rework
    title: Маршрутизация результата ревью — approve, bad_spec или intent_gap
    type: ai
    routing_type: dynamic
    execution_context:
      - type: artifact_ref
        node_id: ai-review
        path: review-report.md
        scope: run
        required: true
        transfer_mode: by_value
      - type: artifact_ref
        node_id: ai-plan
        path: _bmad-output/implementation_artifacts/spec.md
        scope: project
        required: true
        transfer_mode: by_value
    instruction: |
      Прочитай review-report.md и определи категорию блокирующей находки.

      ПУТЬ А — "rework-spec" (находки bad_spec):
        1. Извлеки KEEP-инструкции из diff: положительные элементы, которые сработали
           и должны сохраниться при перевыведении.
        2. Прочитай ## Журнал изменений спека в spec.md. Исправь ТОЛЬКО незамороженные
           разделы, содержащие первопричину (ничего внутри <frozen-after-approval> не трогать).
           Добавь запись в журнал: triggering-находка, что исправлено, избегаемое плохое
           состояние и KEEP-инструкции.

      ПУТЬ Б — "rework-intent" (находки intent_gap):
        Откати все изменения кода до baseline_commit из frontmatter spec.md.
        Планирование начнётся с нуля.

      ПУТЬ В — "approve" (нет блокирующих находок):
        Рекомендация в review-report.md — "approve". Переходи к презентации.

      Не смешивай пути. Рекомендация в review-report.md — авторитетна.
      Сохрани step-summary.json с полем route:
        - route: "on_success" — если рекомендация review-report.md равна "approve"
        - route: "on_rework" — если рекомендация review-report.md равна "rework-spec" или "rework-intent"

      После выполнения выбранного пути добавь в step-summary.json:
        ПУТЬ А: { "route": "on_bad_spec",   "rework_instruction": ["Переработай спецификацию"] }
        ПУТЬ Б: { "route": "on_bad_intent", "rework_instruction": ["Переработай интент"] }
        ПУТЬ В: { "route": "on_present"}

      Поле "route" в step-summary.json обязательно!
    skill_refs: []
    produced_artifacts: []
    expected_mutations: []
    on_bad_spec:
      transition: ai-implement
      max_loop_count: 10
      keep_changes: false
      session_policy: new_session
    on_bad_intent:
      transition: ai-plan
      max_loop_count: 10
      keep_changes: false
      session_policy: new_session
    on_present:
      transition: ai-present
      max_loop_count: 10
      keep_changes: true
      session_policy: new_session

  # ════════════════════════════════════════════════════════════════════════════
  # ШАГ 5 — Презентация
  # ════════════════════════════════════════════════════════════════════════════

  - id: ai-present
    title: Подготовка к завершению работы
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-plan
        path: _bmad-output/implementation_artifacts/spec.md
        scope: project
        required: true
        transfer_mode: by_value
      - type: artifact_ref
        node_id: ai-review
        path: review-report.md
        scope: run
        required: true
        transfer_mode: by_value
      - type: artifact_ref
        node_id: ai-plan
        path: spec-scratchpad.json
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Измени статус spec.md на done.

      Прочитай spec-scratchpad.json и извлеки поле slug.

      Переименуй файл _bmad-output/implementation_artifacts/spec.md в _bmad-output/implementation_artifacts/spec-{slug}.md

    skill_refs: []
    produced_artifacts: []
    expected_mutations: []
    on_success:
