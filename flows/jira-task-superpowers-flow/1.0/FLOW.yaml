  - id: ai-finalize-jira
    title: Перевести JIRA-задачу в конечный статус
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-fetch-task
        path: jira-task.json
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай jira-task.json и финализируй исходную задачу.

      Используй skill jira-issues строго через MCP-сервер,
      выбранный по environment из jira-task.json.

      Обязательные данные:
      - environment из jira-task.json;
      - taskKey из jira-task.json;
      - issueType из верхнего уровня jira-task.json, либо issuetype/name из issues[0];
      - baseUrl: ${(env.baseUrl)!""}. Если значение пусто после trim,
        заверши ноду ошибкой до любых изменений JIRA.

      Нормализуй baseUrl через trim и удаление завершающих `/`. Проверь, что это
      абсолютный URL со схемой http или https и непустым host, без userinfo,
      query, fragment, пробелов и управляющих символов. Если проверка не пройдена,
      заверши ноду ошибкой до любых изменений JIRA.

      Сначала получи актуальную задачу через jira_get_issue. Нормализуй issueType
      через trim + uppercase и выбери ровно одну цепочку:

      1. Для TASK или ТАСКА передай в jira-issues:
         - taskKey: ключ задачи;
         - environment: контур задачи;
         - outputPath: jira-finalization.json;
         - allowDuplicateComment: false;
         - commentBody: <нормализованный baseUrl>/#/run-console?runId=${run.id};
         - commentReadbackBody: тот же URL, что передан в commentBody;
         - transitionSequence: ["IN_PROGRESS", "Resolved"];
         - expectedFinalStatus: "Resolved".

      2. Для BUG или БАГ передай в jira-issues:
         - taskKey: ключ задачи;
         - environment: контур задачи;
         - outputPath: jira-finalization.json;
         - allowDuplicateComment: false;
         - commentBody: <нормализованный baseUrl>/#/run-console?runId=${run.id};
         - commentReadbackBody: тот же URL, что передан в commentBody;
         - transitionSequence:
           ["На исправлении", "Тестирование", "Подтверждение исправления"];
         - expectedFinalStatus: "Подтверждение исправления".

      Для другого issueType заверши ноду ошибкой: цепочка переходов не определена.
      Не добавляй и не изменяй labels.

      После выполнения снова получи задачу через jira_get_issue и проверь:
      - для TASK или ТАСКА итоговый status.name равен "Resolved";
      - для BUG или БАГ итоговый status.name равен "Подтверждение исправления";
      - точный комментарий со ссылкой на run присутствует: commentPresent=true;
        ранее существовавший комментарий допустим. commentAdded — boolean,
        true только при фактическом добавлении, false при подтверждённом дубле.
        Сравнивай строковое тело ответа с commentReadbackBody; commentBodyExact
        и commentReadbackBodyExact сохраняют один и тот же переданный URL.

      transitionProgress должен подтверждать каждый элемент выбранной цепочки
      по порядку: index — целое число от 0 без пропусков, requested — точный
      элемент запроса, targetStatus — непустая строка, verified=true,
      evidence — initial-status-read только при index=0 либо post-transition-read,
      source — current или carrier. Импортированный проверенный префикс помечается
      carrier; новые наблюдения и переходы — current. Для этих цепочек requested
      и targetStatus должны совпадать после trim + uppercase и замены серий
      пробелов/дефисов на `_`; finalStatus должен совпадать с последним targetStatus.
      transitionSequenceApplied содержит ровно requested из записей current
      с evidence=post-transition-read в порядке цепочки. Не выдумывай доказательства
      для отсутствующих шагов или переходов из предыдущего запуска.

      Сохрани полный результат и историю операций в jira-finalization.json.
      В нём обязательны: ok, environment, taskKey, issueType, commentAdded, commentPresent,
      commentBodyExact, commentReadbackBodyExact, transitionSequenceRequested,
      transitionSequenceApplied, transitionProgress, finalStatus,
      operations и error.
    skill_refs:
      - jira-issues@1.0
    mcp_refs:
      - atlassian_delta
      - atlassian_sigma
      # - atlassian_sbertrack  # временно выведен из эксплуатации
    produced_artifacts:
      - scope: run
        path: jira-finalization.json
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: command-validate-jira-finalization

  - id: command-validate-jira-finalization
    title: Проверить финализацию JIRA-задачи
    type: command
    execution_context:
      - type: artifact_ref
        node_id: ai-finalize-jira
        path: jira-finalization.json
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      set -euo pipefail
      result_file="$(find .hgsdlc/nodes/ai-finalize-jira -type f -path '*/attempt-*/jira-finalization.json' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')"
      test -n "$result_file"
      python3 -c '
      import json, re, sys
      with open(sys.argv[1], encoding="utf-8") as source:
          data = json.load(source)
      required = ["ok", "environment", "taskKey", "issueType", "commentAdded", "commentPresent", "commentBodyExact", "commentReadbackBodyExact", "transitionSequenceRequested", "transitionSequenceApplied", "transitionProgress", "finalStatus", "operations", "error"]
      missing = [name for name in required if name not in data]
      if missing:
          raise SystemExit("jira-finalization.json missing fields: " + ", ".join(missing))
      if data["ok"] is not True:
          raise SystemExit("JIRA finalization failed: " + str(data.get("error", "unknown error")))
      if data["environment"] not in ("DELTA", "SIGMA"):
          raise SystemExit("unsupported JIRA environment: " + str(data["environment"]))
      if not isinstance(data["commentAdded"], bool):
          raise SystemExit("commentAdded must be a boolean")
      if data["commentPresent"] is not True:
          raise SystemExit("run comment was not verified")
      for name in ("commentBodyExact", "commentReadbackBodyExact"):
          if not isinstance(data[name], str) or not data[name].strip():
              raise SystemExit(name + " must be a non-empty string")
      if data["commentBodyExact"] != data["commentReadbackBodyExact"]:
          raise SystemExit("run comment outbound and read-back URLs must match")
      issue_type = str(data["issueType"]).strip().upper()
      if issue_type in ("TASK", "ТАСКА"):
          expected_sequence = ["IN_PROGRESS", "Resolved"]
          expected_status = "Resolved"
      elif issue_type in ("BUG", "БАГ"):
          expected_sequence = ["На исправлении", "Тестирование", "Подтверждение исправления"]
          expected_status = "Подтверждение исправления"
      else:
          raise SystemExit("unsupported issueType: " + str(data["issueType"]))
      if data["transitionSequenceRequested"] != expected_sequence:
          raise SystemExit("unexpected transition sequence: " + str(data["transitionSequenceRequested"]))
      def normalize_status(value):
          return re.sub(r"[\s-]+", "_", value.strip().upper())
      progress = data["transitionProgress"]
      if not isinstance(progress, list) or len(progress) != len(expected_sequence):
          raise SystemExit("transitionProgress must prove the complete expected sequence")
      derived_applied = []
      current_seen = False
      for index, (record, requested) in enumerate(zip(progress, expected_sequence)):
          if not isinstance(record, dict):
              raise SystemExit("transitionProgress record must be an object")
          if type(record.get("index")) is not int or record["index"] != index:
              raise SystemExit("transitionProgress indices must be consecutive from zero")
          if not isinstance(record.get("requested"), str) or record["requested"] != requested:
              raise SystemExit("transitionProgress requested must match the ordered sequence")
          target = record.get("targetStatus")
          if not isinstance(target, str) or not target.strip():
              raise SystemExit("transitionProgress targetStatus must be a non-empty string")
          if normalize_status(target) != normalize_status(requested):
              raise SystemExit("transitionProgress targetStatus does not match the requested status")
          if record.get("verified") is not True:
              raise SystemExit("transitionProgress record must be verified")
          evidence = record.get("evidence")
          if not isinstance(evidence, str) or evidence not in ("initial-status-read", "post-transition-read"):
              raise SystemExit("transitionProgress evidence is invalid")
          if evidence == "initial-status-read" and index != 0:
              raise SystemExit("initial-status-read is allowed only at index zero")
          provenance = record.get("source")
          if not isinstance(provenance, str) or provenance not in ("current", "carrier"):
              raise SystemExit("transitionProgress source is invalid")
          if provenance == "carrier" and current_seen:
              raise SystemExit("carrier evidence must form a prefix")
          if provenance == "current":
              current_seen = True
              if evidence == "post-transition-read":
                  derived_applied.append(requested)
      applied = data["transitionSequenceApplied"]
      if not isinstance(applied, list) or any(not isinstance(item, str) for item in applied):
          raise SystemExit("transitionSequenceApplied must be an array of strings")
      if applied != derived_applied:
          raise SystemExit("transitionSequenceApplied must equal current verified post-transition records")
      if not isinstance(data["finalStatus"], str) or not data["finalStatus"].strip():
          raise SystemExit("finalStatus must be a non-empty string")
      if normalize_status(data["finalStatus"]) != normalize_status(progress[-1]["targetStatus"]) or normalize_status(data["finalStatus"]) != normalize_status(expected_status):
          raise SystemExit("unexpected final JIRA status: " + str(data["finalStatus"]))
      if data["error"] not in ("", None):
          raise SystemExit("JIRA finalization returned an error: " + str(data["error"]))
      ' "$result_file"
    produced_artifacts: []
    expected_mutations: []
    success_exit_codes: [0]
    idempotent: true
    on_success:
      transition: terminal-complete

  # ════════════════════════════════════════════════════════════════════════════
  # Терминал
  # ════════════════════════════════════════════════════════════════════════════

  - id: terminal-complete
    title: Flow завершён
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
