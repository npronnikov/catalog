description: "Быстрый цикл разработки на основе методологии Superpowers — без уточняющих вопросов и промежуточных апрувов. Последовательность: автономный брейнштоминг (brainstorming-summary) → детальный план (writing-plans) → исполнение по плану (executing-plans) → верификация перед завершением → финальный апрув. TDD применяется для testable behaviors. Git-коммиты не входят в план. Автоматический возврат на доработку при незакрытых замечаниях верификации.
"
