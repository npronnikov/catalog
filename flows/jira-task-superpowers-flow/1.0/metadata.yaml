description: >
  A flow for finding a JIRA issue in the selected DELTA or SIGMA environment
  by project, type, status, and assignee strictly through the corresponding
  MCP server (the SBERTRACK reference is retained but disabled) → embedded
  superpowers-quick-dev-flow → issue finalization in JIRA.
  There are no quick-dev or SDD branches.
