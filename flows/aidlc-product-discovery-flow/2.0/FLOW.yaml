id: aidlc-product-discovery-flow
version: "2.0"
canonical_name: aidlc-product-discovery-flow@2.0
title: AIDLC v2 Product Discovery
description: Evidence-backed discovery from raw intent through human-approved, namespaced initiative handoff.
coding_agent: qwen
start_node_id: ai-capture-intent
failure_node_id: terminal-failed
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:
  - id: ai-capture-intent
    title: Capture intent and explicit inputs
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      Read the feature request. Apply the attached skill without asking the user directly.
      Create root run-scoped input-manifest.yaml with an initiative-ID proposal, every
      selected repository and immutable revision, and every selected project artifact
      path. Never search for or substitute an arbitrary "latest" artifact later.
      Write discovery/intake.md and discovery/questions.md. Every missing decision goes
      into the questions artifact with an [Answer]: field; if none remain, record
      status: no_questions and why. Treat secrets as external references, never artifacts.
    skill_refs:
      - aidlc-intent-capture@2.0
    produced_artifacts:
      - scope: run
        path: input-manifest.yaml
        required: true
        modifiable: false
      - scope: run
        path: discovery/intake.md
        required: true
        modifiable: false
      - scope: run
        path: discovery/questions.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-answer-intent
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: human-answer-intent
    title: Answer discovery questions
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-capture-intent
        path: discovery/questions.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Review discovery/intake.md and fill every [Answer]: field in
      discovery/questions.md. Submit when the intent and decision ownership are clear,
      or request rework with concrete corrections to the intake/questions.
    produced_artifacts:
      - scope: run
        path: discovery/questions.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-research-opportunity
    on_rework:
      transition: ai-capture-intent

  - id: ai-research-opportunity
    title: Research opportunity evidence
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-capture-intent
        path: input-manifest.yaml
        scope: run
        required: true
        transfer_mode: by_value
      - type: artifact_ref
        node_id: human-answer-intent
        path: discovery/questions.md
        scope: run
        required: true
        transfer_mode: by_value
    subagent_refs:
      - aidlc-qwen-research-analyst@2.0
    instruction: |
      Read discovery/intake.md, answered discovery/questions.md, and input-manifest.yaml.
      Invoke exactly this named regular Qwen subagent in the foreground:

      agent(
        description="Research opportunity evidence",
        prompt="Read discovery/intake.md and the answered discovery/questions.md. Investigate alternatives and evidence. Return claims with sources, confidence, unknowns, and a PASS or BLOCKED verdict. Do not make the product decision.",
        subagent_type="aidlc-qwen-research-analyst",
        run_in_background=false
      )

      Wait for the returned inline result before continuing. Fail this node if invocation
      fails, output is empty, or the required verdict is missing. Do not replace a failed
      subagent with inline self-review. Do not use fork, background agents, list_agents,
      or send_message. Apply the research skill and synthesize the result into
      discovery/research.md and reviews/research-assessment.md. Preserve `BLOCKED` and
      unsupported claims explicitly; do not make the product decision.
    skill_refs:
      - aidlc-opportunity-research@2.0
    produced_artifacts:
      - scope: run
        path: discovery/research.md
        required: true
        modifiable: false
      - scope: run
        path: reviews/research-assessment.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-feasibility-scope
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: ai-feasibility-scope
    title: Assess feasibility and define scope
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-research-opportunity
        path: discovery/research.md
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Use only the manifest-pinned inputs, approved intake/answers, and research evidence.
      Apply the attached skill. Write discovery/feasibility.md with dimension-by-dimension
      evidence, risks, dependencies, and stop conditions; write discovery/scope-draft.md
      with MVP, in-scope, out-of-scope, and deferred work. Do not hide a research blocker.
    skill_refs:
      - aidlc-feasibility-and-scope@2.0
    produced_artifacts:
      - scope: run
        path: discovery/feasibility.md
        required: true
        modifiable: false
      - scope: run
        path: discovery/scope-draft.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-rough-mockups
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: ai-rough-mockups
    title: Produce rough interaction mockups
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-feasibility-scope
        path: discovery/scope-draft.md
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Apply the attached skill to the scoped user journeys. Write
      discovery/mockups/mockups.md with rough flows/wireframes, states, and assumptions.
      If no interaction surface exists, write `status: not_applicable` and a concrete
      rationale instead of fabricating UI.
    skill_refs:
      - aidlc-rough-mockups@2.0
    produced_artifacts:
      - scope: run
        path: discovery/mockups/mockups.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-discovery-decision
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: ai-discovery-decision
    title: Draft discovery decision
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-rough-mockups
        path: discovery/mockups/mockups.md
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      <#assign gate = step["human-approve-discovery"]!{} />
      Apply the attached skill to all run-scoped discovery artifacts. If this node is
      revisited, incorporate the gate's rework instruction without discarding evidence.
      Write discovery/decision-draft.yaml with exact GO, NO-GO, or DEFER, confidence,
      rationale, blockers, metrics, and approval checklist. Write
      discovery/initiative-brief.md as the proposed handoff; do not publish it yet.
      <#if gate.rework_instruction?has_content>
      Required rework: ${gate.rework_instruction}
      </#if>
    skill_refs:
      - aidlc-discovery-decision@2.0
    produced_artifacts:
      - scope: run
        path: discovery/decision-draft.yaml
        required: true
        modifiable: false
      - scope: run
        path: discovery/initiative-brief.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-approve-discovery
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: human-approve-discovery
    title: Approve discovery decision
    type: human_approval
    execution_context:
      - type: artifact_ref
        node_id: ai-discovery-decision
        path: discovery/initiative-brief.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Review the full discovery evidence, decision draft, initiative brief, and mockups.
      Approve the exact decision and initiative ID for publication, or request targeted
      rework. Approval authorizes publication only, not implementation or deployment.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-publish-discovery
    on_rework:
      transition: ai-discovery-decision

  - id: ai-publish-discovery
    title: Validate and publish approved discovery
    type: ai
    routing_type: dynamic
    execution_context:
      - type: artifact_ref
        node_id: ai-discovery-decision
        path: discovery/decision-draft.yaml
        scope: run
        required: true
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-discovery-decision
        path: discovery/initiative-brief.md
        scope: run
        required: true
        transfer_mode: by_ref
    instruction: |
      Apply the readiness-review skill to the approved discovery package. Write
      reviews/discovery-readiness.md. If READY, publish exact copies under the approved
      initiative ID as aidlc-docs/initiatives/*/discovery/initiative-brief.md,
      decision.yaml, mockups.md, and input-manifest.yaml, then write
      step-summary.json with {"route":"on_success"}. If BLOCKED, do not publish partial
      project artifacts and write {"route":"on_blocked"}. Never replace the `*` with an
      unapproved or inferred ID.
    skill_refs:
      - aidlc-readiness-review@2.0
    produced_artifacts:
      - scope: run
        path: reviews/discovery-readiness.md
        required: true
        modifiable: false
      - scope: project
        path: aidlc-docs/initiatives/*/discovery/initiative-brief.md
        required: true
        modifiable: false
      - scope: project
        path: aidlc-docs/initiatives/*/discovery/decision.yaml
        required: true
        modifiable: false
      - scope: project
        path: aidlc-docs/initiatives/*/discovery/mockups.md
        required: true
        modifiable: false
      - scope: project
        path: aidlc-docs/initiatives/*/discovery/input-manifest.yaml
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: terminal-complete
    on_blocked:
      transition: terminal-failed
    retry_policy:
      attempts: 2
      on_errors: [AGENT_EXECUTION_FAILED, AGENT_SESSION_RESUME_FAILED, NODE_VALIDATION_FAILED, ACP_REQUEST_FAILED]

  - id: terminal-complete
    title: Discovery package published
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []

  - id: terminal-failed
    title: Discovery blocked without publication
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
