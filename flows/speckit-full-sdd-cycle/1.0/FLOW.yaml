id: speckit-full-sdd-cycle
version: "1.0"
canonical_name: speckit-full-sdd-cycle@1.0
title: SpecKit Full SDD Cycle
description: >
  Полный цикл Spec-Driven Development: описание фичи → конституция →
  спецификация → уточнение → анализ → чеклист → апрув спеки →
  технический план → декомпозиция задач → апрув задач →
  реализация → финальный акцепт.
coding_agent: qwen
start_node_id: ai-feature-input
failure_node_id: terminal-complete
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false

nodes:

  # ── Шаг 1: Формализация запроса фичи ─────────────────────────────────────
  - id: ai-feature-input
    title: Формализация описания фичи
    type: ai
    routing_type: static
    execution_context: []
    instruction: |
      Изучи пользовательский запрос: ${run.feature_request}

      Создай файл feature-request.md и запиши в нём:

      1. Что нужно сделать (краткое описание фичи)
      2. Зачем это нужно (бизнес-контекст, проблема которую решаем)
      3. Кто будет использовать (пользователи, роли, актёры)
      4. Любые известные ограничения, требования или исключения
    produced_artifacts:
      - scope: run
        path: feature-request.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-constitution
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 2: Создание конституции проекта ──────────────────────────────────
  - id: ai-constitution
    title: Конституция проекта
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-feature-input
        path: feature-request.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveSpec = step["approve-spec"]!{} />
      <#if approveSpec.rework_instruction?has_content && (approveSpec.keep_changes!false)>
      Обнови constitution.md с учётом замечания: ${approveSpec.rework_instruction}
      <#else>
      Прочитай описание фичи из feature-request.md.
      Следуй приложенному скилу. Исследуй кодовую базу и существующую документацию.
      Создай governance-документ проекта в constitution.md.
      </#if>
    skill_refs:
      - speckit-constitution@1.0
    produced_artifacts:
      - scope: run
        path: constitution.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-specify
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 3: Создание спецификации ─────────────────────────────────────────
  - id: ai-specify
    title: Создание спецификации
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-feature-input
        path: feature-request.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-constitution
        path: constitution.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveSpec = step["approve-spec"]!{} />
      <#if approveSpec.rework_instruction?has_content && (approveSpec.keep_changes!false)>
      Доработай spec.md с учётом замечания: ${approveSpec.rework_instruction}
      <#else>
      Прочитай feature-request.md и constitution.md.
      Следуй приложенному скилу. Создай структурированную спецификацию в spec.md.
      Фокус на ЧТО и ЗАЧЕМ — без деталей реализации и технологий.
      </#if>
    skill_refs:
      - speckit-specify@1.0
    produced_artifacts:
      - scope: run
        path: spec.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-clarify
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 4: Генерация вопросов для уточнения ──────────────────────────────
  - id: ai-clarify
    title: Уточнение спецификации
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай спецификацию из spec.md.
      Следуй приложенному скилу.
      Найди неоднозначности и сформируй до 5 целевых вопросов для уточнения.
      Каждый вопрос должен влиять на архитектуру, модель данных или acceptance criteria.
      Сохрани список вопросов с рекомендованными ответами в clarify-questions.md.
    skill_refs:
      - speckit-clarify@1.0
    produced_artifacts:
      - scope: run
        path: clarify-questions.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: human-clarify-answers
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 5: Ответы пользователя на вопросы уточнения ──────────────────────
  - id: human-clarify-answers
    title: Ответы на уточняющие вопросы
    type: human_input
    execution_context:
      - type: artifact_ref
        node_id: ai-clarify
        path: clarify-questions.md
        scope: run
        required: true
        modifiable: true
        transfer_mode: by_ref
    instruction: |
      Открой clarify-questions.md.
      Для каждого вопроса заполни поле "Ответ:" своим выбором или кратким ответом.
      Если рекомендованный ответ подходит — напиши "Рекомендованный" или просто его текст.
      Нажми Submit когда ответишь на все вопросы.
    produced_artifacts:
      - scope: run
        path: clarify-questions.md
        required: true
    expected_mutations: []
    on_submit:
      transition: ai-analyze
    on_rework:
      transition: ai-clarify

  # ── Шаг 6: Анализ консистентности ────────────────────────────────────────
  - id: ai-analyze
    title: Анализ консистентности артефактов
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: human-clarify-answers
        path: clarify-questions.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-constitution
        path: constitution.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай spec.md, clarify-questions.md и constitution.md.
      Следуй приложенному скилу.
      Прими ответы из clarify-questions.md как разрешённые уточнения спецификации.
      Выяви неоднозначности, дублирования, пробелы покрытия и нарушения конституции.
      Сохрани отчёт анализа в analysis-report.md (только чтение артефактов — не модифицируй spec.md).
    skill_refs:
      - speckit-analyze@1.0
    produced_artifacts:
      - scope: run
        path: analysis-report.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-checklist
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 7: Чеклист качества требований ───────────────────────────────────
  - id: ai-checklist
    title: Чеклист качества требований
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-analyze
        path: analysis-report.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      Прочитай spec.md и analysis-report.md.
      Следуй приложенному скилу.
      Сгенерируй чеклист качества требований в checklist.md.
      Каждый пункт — вопрос о качестве написанных требований, не о реализации.
      Пункты со ссылками на разделы spec.md и маркерами [Gap], [Clarity] и т.д.
    skill_refs:
      - speckit-checklist@1.0
    produced_artifacts:
      - scope: run
        path: checklist.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-spec
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 8: Апрув спецификации ─────────────────────────────────────────────
  - id: approve-spec
    title: Апрув качества спецификации
    type: human_approval
    execution_context: []
    instruction: |
      Проверь качество спецификации по трём артефактам:
      - spec.md — структурированная спецификация фичи
      - analysis-report.md — отчёт консистентности (обрати внимание на CRITICAL/HIGH)
      - checklist.md — чеклист качества требований

      Убедись, что:
      - Все требования чёткие и тестируемые
      - Критических неоднозначностей нет (или они приняты осознанно)
      - Спецификация достаточна для технического планирования
      - Success criteria измеримы и не содержат деталей реализации

      Утверди для перехода к техническому планированию или верни на доработку
      с конкретным замечанием.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-plan
    on_rework:
      transition: ai-specify

  # ── Шаг 9: Технический план ───────────────────────────────────────────────
  - id: ai-plan
    title: Технический план реализации
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-constitution
        path: constitution.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: human-clarify-answers
        path: clarify-questions.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveTasks = step["approve-tasks"]!{} />
      <#if approveTasks.rework_instruction?has_content && (approveTasks.keep_changes!false)>
      Доработай plan.md с учётом замечания: ${approveTasks.rework_instruction}
      <#else>
      Прочитай spec.md, constitution.md и clarify-questions.md.
      Следуй приложенному скилу. Исследуй кодовую базу проекта: структуру пакетов,
      существующие паттерны, миграции, тесты, используемый стек.
      Создай детальный технический план в plan.md включая:
      - проверку соответствия конституции
      - выбор технологий с обоснованием
      - модель данных
      - структуру изменений (Create/Modify по файлам)
      - фазы реализации с контрольными точками
      </#if>
    skill_refs:
      - speckit-plan@1.0
    produced_artifacts:
      - scope: run
        path: plan.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: ai-tasks
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 10: Декомпозиция задач ────────────────────────────────────────────
  - id: ai-tasks
    title: Декомпозиция задач
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-plan
        path: plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveTasks = step["approve-tasks"]!{} />
      <#if approveTasks.rework_instruction?has_content && (approveTasks.keep_changes!false)>
      Перегенерируй tasks.md с учётом замечания: ${approveTasks.rework_instruction}
      <#else>
      Прочитай plan.md и spec.md.
      Следуй приложенному скилу. Сгенерируй упорядоченный по зависимостям список
      задач в tasks.md. Организуй по пользовательским историям с метками [US1], [US2]...
      Пометь параллельные задачи [P]. Каждая фаза должна быть независимо тестируемой.
      </#if>
    skill_refs:
      - speckit-tasks@1.0
    produced_artifacts:
      - scope: run
        path: tasks.md
        required: true
        modifiable: false
    expected_mutations: []
    on_success:
      transition: approve-tasks
    retry_policy:
      attempts: 3
      on_errors:
        - NODE_VALIDATION_FAILED

  # ── Шаг 11: Апрув декомпозиции задач ─────────────────────────────────────
  - id: approve-tasks
    title: Апрув декомпозиции задач
    type: human_approval
    execution_context: []
    instruction: |
      Проверь декомпозицию задач в tasks.md.

      Убедись, что:
      - Все задачи пронумерованы (T001, T002...) с конкретным описанием и путём к файлу
      - Порядок зависимостей корректен (foundation → user stories)
      - Параллельные задачи [P] действительно независимы
      - Каждая пользовательская история имеет полный набор задач [US1], [US2]...
      - Декомпозиция соответствует плану plan.md и спецификации spec.md

      Утверди для начала реализации или верни на доработку с конкретным замечанием.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: ai-implement
    on_rework:
      transition: ai-tasks

  # ── Шаг 12: Реализация ────────────────────────────────────────────────────
  - id: ai-implement
    title: Реализация по задачам
    type: ai
    routing_type: static
    execution_context:
      - type: artifact_ref
        node_id: ai-tasks
        path: tasks.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-plan
        path: plan.md
        scope: run
        required: true
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: ai-specify
        path: spec.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
      - type: artifact_ref
        node_id: approve-final
        path: tasks.md
        scope: run
        required: false
        modifiable: false
        transfer_mode: by_ref
    instruction: |
      <#assign approveFinal = step["approve-final"]!{} />
      <#if approveFinal.rework_instruction?has_content && (approveFinal.keep_changes!false)>
      Устрани замечания: ${approveFinal.rework_instruction}
      <#else>
      Прочитай tasks.md и plan.md.
      Следуй приложенному скилу. Реализуй все задачи из tasks.md фаза за фазой:
      - Находи первую невыполненную задачу [ ] и реализуй её
      - После выполнения помечай задачу [x] в tasks.md
      - После каждой фазы запускай команду верификации из plan.md
      - Не создавай копии файлов с суффиксами _new, _modified и т.п.
      </#if>
    skill_refs:
      - speckit-implement@1.0
    produced_artifacts: []
    expected_mutations: []
    on_success:
      transition: approve-final
    retry_policy:
      attempts: 3
      on_errors: 
        - NODE_VALIDATION_FAILED
        
  # ── Шаг 13: Финальный акцепт ──────────────────────────────────────────────
  - id: approve-final
    title: Финальный акцепт результата
    type: human_approval
    execution_context: []
    instruction: |
      Проведи финальный акцепт результата разработки.

      Проверь:
      - Все задачи из tasks.md отмечены [x]
      - Реализация соответствует спецификации spec.md
      - Код соответствует принципам конституции constitution.md
      - Билд проходит, тесты зелёные
      - Функциональность работает корректно согласно acceptance criteria

      Утверди для завершения флоу или верни на доработку с конкретным замечанием.
    produced_artifacts: []
    expected_mutations: []
    on_approve:
      transition: terminal-complete
    on_rework:
      transition: ai-implement

  # ── Терминальная нода ─────────────────────────────────────────────────────
  - id: terminal-complete
    title: SDD-цикл завершён
    type: terminal
    execution_context: []
    produced_artifacts: []
    expected_mutations: []
